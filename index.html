    :root { --theme-accent: #f43f5e; }

    body {

      letter-spacing: -0.015em;
    }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    #map { height: 100%; width: 100%; z-index: 10; background: #dbeafe; }
    .dark #map { background: #0f172a; }
    .soft-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
    .soft-scroll::-webkit-scrollbar-track { background: transparent; }
    .soft-scroll::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.35); border-radius: 9999px; }
    .leaflet-popup-content-wrapper {
      background: #ffffff;
      color: #0f172a;
      border-radius: 20px;
      box-shadow: 0 20px 35px -10px rgba(15, 23, 42, 0.28);
      border: 2px solid #f1f5f9;
      padding: 0;
    }
    .dark .leaflet-popup-content-wrapper {
      background: #1e293b;
      color: #f8fafc;
      border-color: #334155;
    }
    .leaflet-popup-tip { background: #ffffff; }
    .dark .leaflet-popup-tip { background: #1e293b; }
    .leaflet-popup-content { margin: 14px 16px; font-family: 'Plus Jakarta Sans', sans-serif; }
    .leaflet-container a.leaflet-popup-close-button {
      color: #94a3b8;
      padding: 10px 12px 0 0;
    }
    .world-park-pin {
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .world-park-pin:hover {
      transform: translateY(-5px) scale(1.08);
      z-index: 1000 !important;
    }
    .ride-dot-pin {
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .ride-dot-pin:hover {
      transform: scale(1.22);
      z-index: 1000 !important;
    }

<body class="h-[100dvh] w-screen overflow-hidden flex flex-col bg-[#fffdf9] text-slate-900 dark:bg-[#0f1420] dark:text-slate-100 select-none antialiased transition-colors duration-300">

      <button onclick="toggleTheme()" class="w-9 h-9 rounded-full bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 flex items-center justify-center text-slate-700 dark:text-slate-200 transition">
        <i id="theme-icon" class="ph-bold ph-moon text-base"></i>
      </button>
    </div>
  </header>

    let riddenRides = JSON.parse(localStorage.getItem("ctc_ridden_rides") || "{}");
    let currentCategoryFilter = "core";
    let currentRegionFilter = "ALL";
    let activeParkId = null;
    let currentMapStyle = "topo";

    const map = L.map("map", { zoomControl: false, attributionControl: false }).setView([25, 45], 3);
    L.control.zoom({ position: "bottomright" }).addTo(map);

    const tileLayers = {
      topo: L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19 }),
      satellite: L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19 })
    };
    tileLayers.topo.addTo(map);

    const parkMarkersGroup = L.layerGroup().addTo(map);
    const rideMarkersGroup = L.layerGroup().addTo(map);

    function applyMapTiles() {
      Object.values(tileLayers).forEach(l => map.removeLayer(l));
      if (currentMapStyle === "satellite") {
        tileLayers.satellite.addTo(map);
      } else {
        tileLayers.topo.addTo(map);
      }
    }

    function setMapStyle(style) {
      currentMapStyle = style;
      const activeCls = "flex items-center gap-1.5 px-4 py-1.5 rounded-full bg-slate-900 text-white dark:bg-white dark:text-slate-900 transition";
      const inactiveCls = "flex items-center gap-1.5 px-4 py-1.5 rounded-full text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white transition";
      document.getElementById("mstyle-topo").className = style === "topo" ? activeCls : inactiveCls;
      document.getElementById("mstyle-satellite").className = style === "satellite" ? activeCls : inactiveCls;
      applyMapTiles();
    }

    function toggleTheme() {
      const html = document.documentElement;
      html.classList.toggle("dark");
      const dark = html.classList.contains("dark");
      localStorage.setItem("ctc_theme", dark ? "dark" : "light");
      document.getElementById("theme-icon").className = dark ? "ph-bold ph-sun text-base" : "ph-bold ph-moon text-base";
    }

    (function initTheme() {
      if (localStorage.getItem("ctc_theme") === "dark") {
        document.documentElement.classList.add("dark");
        document.getElementById("theme-icon").className = "ph-bold ph-sun text-base";
      }
    })();

    function getLogoTag(park) {
      return `<img src="${park.logoUrl}" alt="${park.shortName}" class="w-full h-full object-contain" onerror="this.src='${park.fallbackLogo}'" />`;
    }

    function getVisibleParks() {
      return PARKS_DATA.filter(p => {
        const catMatch = currentCategoryFilter === "all" || p.category === "core";
        const regMatch = currentRegionFilter === "ALL" || p.region === currentRegionFilter;
        return catMatch && regMatch;
      });
    }

    function setCategoryFilter(filter) {
      currentCategoryFilter = filter;
      const activeD = "px-4 py-1.5 rounded-full transition-all bg-rose-500 text-white shadow-sm";
      const inactiveD = "px-4 py-1.5 rounded-full text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white transition-all";
      document.getElementById("btn-cat-core").className = filter === "core" ? activeD : inactiveD;
      document.getElementById("btn-cat-all").className = filter === "all" ? activeD : inactiveD;

      const activeM = "flex-1 py-2 rounded-full text-xs font-bold bg-rose-500 text-white shadow-sm";
      const inactiveM = "flex-1 py-2 rounded-full text-xs font-bold bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300";
      document.getElementById("m-btn-cat-core").className = filter === "core" ? activeM : inactiveM;
      document.getElementById("m-btn-cat-all").className = filter === "all" ? activeM : inactiveM;

      renderParkDirectory();
      renderGlobalMarkers();
    }

    function setRegionFilter(region) {
      currentRegionFilter = region;
      document.querySelectorAll(".region-pill").forEach(btn => {
        const isCurrent = btn.getAttribute("data-region") === region;
        btn.className = isCurrent
          ? "region-pill shrink-0 px-3.5 py-1.5 rounded-full bg-slate-900 text-white dark:bg-white dark:text-slate-900 transition"
          : "region-pill shrink-0 px-3.5 py-1.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 transition";
      });
      renderParkDirectory();
      renderGlobalMarkers();
    }

    function renderGlobalMarkers() {
      parkMarkersGroup.clearLayers();
      if (activeParkId) return;

      getVisibleParks().forEach(park => {
        const riddenCount = park.rides.filter(r => riddenRides[r.id]).length;
        const markerHtml = `
          <div class="world-park-pin inline-flex items-center gap-2 p-1.5 pr-3.5 rounded-full bg-white dark:bg-slate-900 text-slate-900 dark:text-white border-2 shadow-xl whitespace-nowrap cursor-pointer" style="border-color:${park.brandColor}">
            <div class="w-7 h-7 rounded-full bg-white p-1 flex items-center justify-center shrink-0 overflow-hidden">
              ${getLogoTag(park)}
            </div>
            <span class="text-xs font-extrabold tracking-tight">${park.shortName}</span>
            <span class="font-mono text-[11px] font-bold px-2 py-0.5 rounded-full text-white tabular-nums" style="background:${park.brandColor}">${riddenCount}/${park.rides.length}</span>
          </div>
        `;
        const icon = L.divIcon({ html: markerHtml, className: "", iconAnchor: [75, 20] });
        const marker = L.marker(park.coords, { icon }).addTo(parkMarkersGroup);
        marker.on("click", () => selectPark(park.id));
      });
    }

    function renderParkDirectory() {
      const container = document.getElementById("park-list");
      container.innerHTML = "";

      getVisibleParks().forEach(park => {
        const riddenCount = park.rides.filter(r => riddenRides[r.id]).length;
        const pct = Math.round((riddenCount / park.rides.length) * 100);

        const card = document.createElement("div");
        card.className = "park-card group relative rounded-3xl overflow-hidden bg-white dark:bg-slate-900 border-2 border-slate-100 dark:border-slate-800 hover:border-rose-400 dark:hover:border-rose-500 cursor-pointer shadow-sm hover:shadow-xl transition-all duration-300";
        card.onclick = () => selectPark(park.id);

        card.innerHTML = `
          <div class="relative h-36 w-full overflow-hidden bg-slate-900">
            <img src="${park.heroImg}" alt="${park.name}" loading="lazy"
              class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" />
            <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/25 to-transparent"></div>

            <div class="absolute top-3 right-3 px-3 py-1 rounded-full text-white font-mono text-xs font-bold shadow-md tabular-nums" style="background:${park.brandColor}">
              ${riddenCount} / ${park.rides.length}
            </div>

            <div class="absolute bottom-3 left-3.5 right-3.5 flex items-center gap-3">
              <div class="w-12 h-12 rounded-2xl bg-white p-1.5 shrink-0 shadow-lg flex items-center justify-center overflow-hidden">
                ${getLogoTag(park)}
              </div>
              <div class="min-w-0 flex-1">
                <p class="text-[11px] font-bold text-amber-300 truncate">${park.city}</p>
                <h3 class="text-base font-extrabold text-white truncate">${park.name}</h3>
              </div>
            </div>
          </div>
          <div class="w-full h-2 bg-slate-100 dark:bg-slate-800 overflow-hidden">
            <div class="h-full transition-all duration-500" style="width: ${pct}%; background-color: ${park.brandColor}"></div>
          </div>
        `;
        container.appendChild(card);
      });

      gsap.fromTo(".park-card",
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.3, stagger: 0.03, ease: "power2.out" }
      );
    }

    function selectPark(parkId) {
      activeParkId = parkId;
      const park = PARKS_DATA.find(p => p.id === parkId);
      if (!park) return;

      document.documentElement.style.setProperty("--theme-accent", park.brandColor);

      document.getElementById("view-directory").classList.add("hidden");
      document.getElementById("view-park-detail").classList.remove("hidden");
      document.getElementById("world-reset-btn").classList.remove("hidden");
      document.getElementById("world-reset-btn").classList.add("inline-flex");
      document.getElementById("park-floating-controls").classList.remove("hidden");
      document.getElementById("header-park-pill").textContent = park.shortName;

      document.getElementById("detail-hero-img").src = park.heroImg;
      document.getElementById("detail-logo-box").innerHTML = getLogoTag(park);
      document.getElementById("detail-title").textContent = park.name;
      document.getElementById("detail-location").textContent = park.city;

      parkMarkersGroup.clearLayers();
      map.flyTo(park.coords, park.zoom, { duration: 1.1 });

      renderParkDetailRides(park);
      renderParkRideMarkers(park);
    }

    function renderParkDetailRides(park) {
      const riddenCount = park.rides.filter(r => riddenRides[r.id]).length;
      const pct = Math.round((riddenCount / park.rides.length) * 100);

      document.getElementById("detail-progress-text").textContent = `${riddenCount} of ${park.rides.length} Rides Ridden`;
      document.getElementById("detail-progress-bar").style.width = `${pct}%`;

      const grouped = {};
      park.rides.forEach(r => {
        if (!grouped[r.land]) grouped[r.land] = [];
        grouped[r.land].push(r);
      });

      const container = document.getElementById("detail-rides-container");
      container.innerHTML = "";

      Object.entries(grouped).forEach(([land, landRides]) => {
        const section = document.createElement("div");
        section.innerHTML = `
          <div class="flex items-center gap-2 mb-2.5">
            <span class="w-2.5 h-2.5 rounded-full" style="background:${park.brandColor}"></span>
            <span class="text-xs font-extrabold uppercase tracking-wider text-slate-500 dark:text-slate-400">${land}</span>
          </div>
        `;

        const list = document.createElement("div");
        list.className = "space-y-2";

        landRides.forEach(ride => {
          const isChecked = !!riddenRides[ride.id];
          const num = park.rides.findIndex(x => x.id === ride.id) + 1;

          const item = document.createElement("div");
          item.className = `flex items-center justify-between p-3.5 rounded-2xl border-2 cursor-pointer transition-all ${
            isChecked
              ? "bg-emerald-500/10 border-emerald-500 text-slate-900 dark:text-white"
              : "bg-white dark:bg-slate-900 border-slate-100 dark:border-slate-800 hover:border-slate-300 dark:hover:border-slate-700"
          }`;
          item.onclick = () => toggleRide(ride.id);

          item.innerHTML = `
            <div class="flex items-center gap-3 min-w-0">
              <div class="w-7 h-7 rounded-full flex items-center justify-center font-mono text-xs font-bold shrink-0 transition-all"
                style="background:${isChecked ? '#10b981' : park.brandColor}; color:#ffffff">
                ${isChecked ? '<i class="ph-bold ph-check text-xs"></i>' : num}
              </div>
              <span class="text-sm font-bold truncate">${ride.name}</span>
            </div>
            <span class="text-xs font-extrabold px-2.5 py-1 rounded-full shrink-0 ml-2 ${
              isChecked
                ? "bg-emerald-500 text-white"
                : "bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400"
            }">
              ${isChecked ? "Ridden" : "To Ride"}
            </span>
          `;
          list.appendChild(item);
        });

        section.appendChild(list);
        container.appendChild(section);
      });
    }

    function renderParkRideMarkers(park) {
      rideMarkersGroup.clearLayers();

      park.rides.forEach((ride, idx) => {
        const isChecked = !!riddenRides[ride.id];
        const num = idx + 1;

        const pinHtml = `
          <div class="ride-dot-pin w-8 h-8 rounded-full border-2 border-white shadow-xl flex items-center justify-center font-mono text-xs font-bold text-white cursor-pointer"
            style="background:${isChecked ? '#10b981' : park.brandColor}">
            ${isChecked ? '<i class="ph-bold ph-check text-xs"></i>' : num}
          </div>
        `;
        const icon = L.divIcon({ html: pinHtml, className: "", iconSize: [32, 32], iconAnchor: [16, 16] });
        const marker = L.marker([ride.lat, ride.lng], { icon }).addTo(rideMarkersGroup);

        marker.bindPopup(`
          <div class="min-w-[180px] text-center">
            <div class="text-[11px] font-bold uppercase tracking-wider text-slate-400">${ride.land}</div>
            <div class="text-sm font-extrabold mt-0.5 mb-3">${ride.name}</div>
            <button onclick="toggleRide('${ride.id}')" class="w-full py-2 px-3 rounded-full text-xs font-extrabold text-white flex items-center justify-center gap-1.5 transition"
              style="background:${isChecked ? '#64748b' : '#10b981'}">
              <i class="ph-bold ${isChecked ? 'ph-x' : 'ph-check'} text-xs"></i>
              <span>${isChecked ? "Unmark Ride" : "Mark as Ridden"}</span>
            </button>
          </div>
        `);
      });
    }

    function openOfficialMapOverlay() {
      if (!activeParkId) return;
      const park = PARKS_DATA.find(p => p.id === activeParkId);
      if (!park) return;

      document.getElementById("overlay-park-logo").innerHTML = getLogoTag(park);
      document.getElementById("overlay-park-title").textContent = park.name;
      document.getElementById("overlay-external-btn").href = park.officialMapUrl;

      const body = document.getElementById("overlay-body");
      if (park.officialPdf) {
        body.innerHTML = `<iframe src="${park.officialPdf}" class="w-full h-full rounded-2xl border border-white/15 bg-slate-900"></iframe>`;
      } else {
        body.innerHTML = `
          <div class="max-w-lg w-full rounded-3xl bg-slate-900 border border-white/15 overflow-hidden shadow-2xl text-center p-6 sm:p-8 space-y-5">
            <div class="w-16 h-16 rounded-2xl bg-white p-2 mx-auto shadow-lg flex items-center justify-center overflow-hidden">
              ${getLogoTag(park)}
            </div>
            <div class="space-y-2">
              <h4 class="text-xl font-extrabold text-white">${park.name} Official Map</h4>
              <p class="text-xs text-slate-300 leading-relaxed">
                Open the official illustrated resort map guide from ${park.shortName} in a new tab, or tap the numbered pins directly on the park map to check off your rides.
              </p>
            </div>
            <a href="${park.officialMapUrl}" target="_blank" rel="noopener noreferrer"
              class="w-full py-3.5 px-5 rounded-full bg-amber-400 hover:bg-amber-300 text-slate-950 text-xs font-extrabold flex items-center justify-center gap-2 shadow-lg transition">
              <i class="ph-bold ph-map-trifold text-base"></i>
              <span>Open Official ${park.shortName} Map</span>
              <i class="ph-bold ph-arrow-up-right"></i>
            </a>
          </div>
        `;
      }

      document.getElementById("official-map-overlay").classList.remove("hidden");
    }

    function closeOfficialMapOverlay() {
      document.getElementById("official-map-overlay").classList.add("hidden");
    }

    function toggleRide(rideId) {
      riddenRides[rideId] = !riddenRides[rideId];
      localStorage.setItem("ctc_ridden_rides", JSON.stringify(riddenRides));
      if (activeParkId) {
        const park = PARKS_DATA.find(p => p.id === activeParkId);
        renderParkDetailRides(park);
        renderParkRideMarkers(park);
      } else {
        renderGlobalMarkers();
      }
    }

    function toggleAllParkRides() {
      if (!activeParkId) return;
      const park = PARKS_DATA.find(p => p.id === activeParkId);
      const allDone = park.rides.every(r => riddenRides[r.id]);
      park.rides.forEach(r => { riddenRides[r.id] = !allDone; });
      localStorage.setItem("ctc_ridden_rides", JSON.stringify(riddenRides));
      renderParkDetailRides(park);
      renderParkRideMarkers(park);
    }

    function resetWorldView() {
      activeParkId = null;
      rideMarkersGroup.clearLayers();
      closeOfficialMapOverlay();

      document.getElementById("view-park-detail").classList.add("hidden");
      document.getElementById("view-directory").classList.remove("hidden");
      document.getElementById("world-reset-btn").classList.add("hidden");
      document.getElementById("world-reset-btn").classList.remove("inline-flex");
      document.getElementById("park-floating-controls").classList.add("hidden");
      document.getElementById("header-park-pill").textContent = "World Map";

      setMapStyle("topo");
      map.invalidateSize();
      map.flyTo([25, 45], 3, { duration: 1.0 });
      renderParkDirectory();
      renderGlobalMarkers();
    }

    function switchMobileTab(tab) {
      const drawer = document.getElementById("left-drawer");
      const mapWorkspace = document.getElementById("map-workspace");
      const tabList = document.getElementById("mob-tab-list");
      const tabMap = document.getElementById("mob-tab-map");

      const activeClass = "flex items-center justify-center gap-2 rounded-full text-xs font-extrabold bg-rose-500 text-white";
      const inactiveClass = "flex items-center justify-center gap-2 rounded-full text-xs font-extrabold text-slate-500 dark:text-slate-400";

      tabList.className = tab === "list" ? activeClass : inactiveClass;
      tabMap.className = tab === "map" ? activeClass : inactiveClass;

      if (tab === "list") {
        drawer.classList.remove("hidden");
        mapWorkspace.classList.add("hidden");
      } else {
        drawer.classList.add("hidden");
        mapWorkspace.classList.remove("hidden");
        mapWorkspace.classList.add("flex");
        setTimeout(() => map.invalidateSize(), 50);
      }
    }

    window.addEventListener("resize", () => {
      if (window.innerWidth >= 1024) {
        document.getElementById("left-drawer").classList.remove("hidden");
        document.getElementById("map-workspace").classList.remove("hidden");
      }
      map.invalidateSize();
    });

    renderParkDirectory();
    renderGlobalMarkers();
  </script>
</body>
</html>
