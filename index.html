<!DOCTYPE html>

  <!-- Google Fonts: Geist & Geist Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Geist"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['"Geist Mono"', 'monospace'],
          },
          colors: {
            accent: {
              400: '#fb7185',
              500: '#f43f5e',
              600: '#e11d48',
            }
          }
        }
      }
    };
  </script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
      letter-spacing: -0.015em;
    }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    #map { height: 100%; width: 100%; z-index: 10; background: #e4e4e7; }
    .dark #map { background: #09090b; }

    .clean-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
    .clean-scroll::-webkit-scrollbar-track { background: transparent; }
    .clean-scroll::-webkit-scrollbar-thumb { background: rgba(161, 161, 170, 0.25); border-radius: 9999px; }
    .clean-scroll::-webkit-scrollbar-thumb:hover { background: rgba(161, 161, 170, 0.45); }

    .leaflet-popup-content-wrapper {
      background: rgba(9, 9, 11, 0.96);
      backdrop-filter: blur(14px);
      color: #fafafa;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      box-shadow: 0 20px 38px -10px rgba(0, 0, 0, 0.65);
      padding: 0;
    }
    .leaflet-popup-tip { background: rgba(9, 9, 11, 0.96); }
    .leaflet-popup-content { margin: 12px 14px; font-family: 'Geist', sans-serif; }
    .leaflet-container a.leaflet-popup-close-button {
      color: #a1a1aa;
      padding: 8px 8px 0 0;
    }
    .leaflet-container a.leaflet-popup-close-button:hover { color: #ffffff; }

    /* Illustrated Map Pin Pulse */
    @keyframes subtlePulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.04); }
    }
    .illus-pin {
      transform: translate(-50%, -50%);
      transition: transform 0.18s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.18s ease;
    }
    .illus-pin:hover {
      transform: translate(-50%, -50%) scale(1.12);
      z-index: 40 !important;
    }
  </style>
</head>

<body class="h-[100dvh] w-screen overflow-hidden flex flex-col bg-zinc-50 text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100 select-none antialiased">

    <div class="flex items-center gap-3 min-w-0">
      <button onclick="resetWorldView()" class="text-left focus:outline-none group flex items-baseline gap-2.5">
        <span class="text-base font-bold tracking-[-0.03em] text-zinc-900 dark:text-zinc-100 group-hover:text-accent-600 dark:group-hover:text-accent-400 transition-colors">

          <!-- Top Bar Inside Hero -->
          <div class="absolute top-3 left-3.5 right-3.5 flex items-center justify-between">
            <button onclick="resetWorldView()" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-zinc-950/75 hover:bg-zinc-950 text-white backdrop-blur-md border border-white/15 text-xs font-medium transition">

            <a id="detail-official-map-link" href="#" target="_blank" rel="noopener noreferrer"

                <p id="detail-location" class="text-xs text-zinc-300 truncate"></p>

            </div>

        <!-- Park Progress & Quick Filter Bar -->

    // Persistent LocalStorage State
    let riddenRides = JSON.parse(localStorage.getItem("ctc_ridden_rides") || "{}");
    let customRides = JSON.parse(localStorage.getItem("ctc_custom_rides") || "{}");
    let currentCategoryFilter = "core";
    let currentRegionFilter = "ALL";
    let currentRideStatusFilter = "all";
    let activeParkId = null;
    let activeParkMapView = "illustrated"; // 'illustrated' | 'satellite' | 'official'

    // Initialize Leaflet Map (Key-Free Esri ArcGIS REST MapServer Tiles)
    const map = L.map("map", { zoomControl: false, attributionControl: false }).setView([25, 45], 3);
    L.control.zoom({ position: "bottomright" }).addTo(map);

    const tileLayers = {
      darkCanvas: L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}", { maxZoom: 16 }),
      lightCanvas: L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}", { maxZoom: 16 }),
      satellite: L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19 }),
      topo: L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19 })
    };

    const parkMarkersGroup = L.layerGroup().addTo(map);
    const rideMarkersGroup = L.layerGroup().addTo(map);
    const landPolygonsGroup = L.layerGroup().addTo(map);

    function isDarkMode() {
      return document.documentElement.classList.contains("dark");
    }

    function applyWorldBasemap() {
      Object.values(tileLayers).forEach(l => map.removeLayer(l));
      if (activeParkId && activeParkMapView === "satellite") {
        tileLayers.satellite.addTo(map);
      } else {
        (isDarkMode() ? tileLayers.darkCanvas : tileLayers.lightCanvas).addTo(map);
      }
    }

    function toggleTheme() {
      const html = document.documentElement;
      html.classList.toggle("dark");
      const dark = html.classList.contains("dark");
      localStorage.setItem("ctc_theme", dark ? "dark" : "light");
      document.getElementById("theme-icon").className = dark ? "ph ph-sun text-base" : "ph ph-moon text-base";
      applyWorldBasemap();
    }

    (function initTheme() {
      const saved = localStorage.getItem("ctc_theme");
      if (saved === "light") {
        document.documentElement.classList.remove("dark");
        document.getElementById("theme-icon").className = "ph ph-moon text-base";
      }
      applyWorldBasemap();
    })();

    // Helper: Render Park Logo with Automatic Brand Crest Fallback
    function getLogoHtml(park, sizeClass = "w-full h-full object-contain") {
      if (park.logoUrl) {
        return `<img src="${park.logoUrl}" alt="${park.shortName}" class="${sizeClass}" onerror="this.outerHTML='<span class=\\'font-mono font-bold text-xs text-zinc-900\\'>${park.logoFallback}</span>'" />`;
      }
      return `<span class="font-mono font-bold text-xs tracking-tighter" style="color:${park.brandColor}">${park.logoFallback}</span>`;
    }

    function getAllRidesForPark(park) {
      const extra = customRides[park.id] || [];
      return [...park.rides, ...extra];
    }

    function getVisibleParks() {
      return PARKS_DATA.filter(p => {
        const catMatch = currentCategoryFilter === "all" || p.category === "core";
        const regMatch = currentRegionFilter === "ALL" || p.region === currentRegionFilter;
        return catMatch && regMatch;
      });
    }

    function setCategoryFilter(filter) {
      currentCategoryFilter = filter;
      const activeD = "px-3 py-1 rounded-md font-medium transition-all bg-white dark:bg-zinc-800 text-zinc-900 dark:text-zinc-100 shadow-sm";
      const inactiveD = "px-3 py-1 rounded-md font-medium text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-200 transition-all";
      document.getElementById("btn-cat-core").className = filter === "core" ? activeD : inactiveD;
      document.getElementById("btn-cat-all").className = filter === "all" ? activeD : inactiveD;

      const activeM = "flex-1 py-1.5 rounded-lg text-xs font-medium bg-zinc-900 text-white dark:bg-zinc-100 dark:text-zinc-900";
      const inactiveM = "flex-1 py-1.5 rounded-lg text-xs font-medium bg-zinc-100 dark:bg-zinc-900 text-zinc-500 dark:text-zinc-400";
      document.getElementById("m-btn-cat-core").className = filter === "core" ? activeM : inactiveM;
      document.getElementById("m-btn-cat-all").className = filter === "all" ? activeM : inactiveM;

      renderParkDirectory();
      renderGlobalMarkers();
      updateGlobalStats();
    }

    function setRegionFilter(region) {
      currentRegionFilter = region;
      document.querySelectorAll(".region-pill").forEach(btn => {
        const isCurrent = btn.getAttribute("data-region") === region;
        btn.className = isCurrent
          ? "region-pill shrink-0 px-2.5 py-1 rounded-md bg-zinc-900 text-white dark:bg-zinc-100 dark:text-zinc-900 transition"
          : "region-pill shrink-0 px-2.5 py-1 rounded-md text-zinc-500 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-zinc-900 transition";
      });
      renderParkDirectory();
      renderGlobalMarkers();
    }

    function clearSearch() {
      document.getElementById("park-search").value = "";
      renderParkDirectory();
    }

    function updateGlobalStats() {
      const parks = PARKS_DATA.filter(p => currentCategoryFilter === "all" || p.category === "core");
      let totalRides = 0;
      let completedRides = 0;
      parks.forEach(p => {
        const rides = getAllRidesForPark(p);
        totalRides += rides.length;
        rides.forEach(r => { if (riddenRides[r.id]) completedRides++; });
      });
      document.getElementById("stat-rides").textContent = `${completedRides} / ${totalRides}`;
    }

    // World Map Markers with Park Logos & Ride Badges
    function renderGlobalMarkers() {
      parkMarkersGroup.clearLayers();
      if (activeParkId) return;

      getVisibleParks().forEach(park => {
        const rides = getAllRidesForPark(park);
        const riddenCount = rides.filter(r => riddenRides[r.id]).length;

        const markerHtml = `
          <div class="group inline-flex items-center gap-2 p-1 pr-2.5 rounded-xl bg-zinc-950/95 text-white border border-white/20 shadow-xl whitespace-nowrap hover:scale-105 transition-transform">
            <div class="w-6 h-6 rounded-lg bg-white p-0.5 flex items-center justify-center shrink-0 overflow-hidden">
              ${getLogoHtml(park, "w-full h-full object-contain")}
            </div>
            <span class="text-[11px] font-semibold tracking-tight">${park.shortName}</span>
            <span class="font-mono text-[10px] px-1.5 py-0.5 rounded bg-white/10 text-zinc-200 tabular-nums">${riddenCount}/${rides.length}</span>
          </div>
        `;
        const icon = L.divIcon({ html: markerHtml, className: "", iconAnchor: [70, 16] });
        const marker = L.marker(park.coords, { icon }).addTo(parkMarkersGroup);
        marker.on("click", () => selectPark(park.id));
      });
    }

    // Rich Visual Park Cards in Sidebar Directory
    function renderParkDirectory() {
      const query = document.getElementById("park-search").value.trim().toLowerCase();
      document.getElementById("clear-search-btn").classList.toggle("hidden", !query);

      const container = document.getElementById("park-list");
      container.innerHTML = "";

      const filtered = getVisibleParks().filter(p => {
        const rides = getAllRidesForPark(p);
        return p.name.toLowerCase().includes(query) ||
               p.city.toLowerCase().includes(query) ||
               rides.some(r => r.name.toLowerCase().includes(query) || r.land.toLowerCase().includes(query));
      });

      filtered.forEach(park => {
        const rides = getAllRidesForPark(park);
        const riddenCount = rides.filter(r => riddenRides[r.id]).length;
        const pct = rides.length ? Math.round((riddenCount / rides.length) * 100) : 0;

        const card = document.createElement("div");
        card.className = "group relative rounded-2xl overflow-hidden border border-zinc-200/80 dark:border-zinc-800/90 bg-zinc-900 cursor-pointer shadow-sm hover:shadow-xl hover:border-zinc-400 dark:hover:border-zinc-600 transition-all";
        card.onclick = () => selectPark(park.id);

        card.innerHTML = `

    // Selecting a Park Opens Its Specific Park Map & Ride Checklist
    function selectPark(parkId) {
      activeParkId = parkId;
      const park = PARKS_DATA.find(p => p.id === parkId);
      if (!park) return;

      document.getElementById("view-directory").classList.add("hidden");
      document.getElementById("view-park-detail").classList.remove("hidden");
      document.getElementById("world-reset-btn").classList.remove("hidden");
      document.getElementById("world-reset-btn").classList.add("inline-flex");
      document.getElementById("park-map-toolbar").classList.remove("hidden");
      document.getElementById("header-context").textContent = `${park.name} — Park Map`;

      // Populate Hero & Logo in Sidebar
      const heroImg = document.getElementById("detail-hero-img");
      heroImg.style.display = "block";
      heroImg.src = park.heroImg;
      document.getElementById("detail-logo-box").innerHTML = getLogoHtml(park);
      document.getElementById("detail-park-tag").textContent = park.category === "core" ? `${park.lands.length} Themed Lands` : "Featured Experience";
      document.getElementById("detail-title").textContent = park.name;
      document.getElementById("detail-location").textContent = park.city;
      document.getElementById("detail-official-map-link").href = park.officialMapUrl;

      parkMarkersGroup.clearLayers();
      renderParkDetailRides(park);
      renderParkRideMarkers(park);

      // Open the Park's Specific Illustrated Map by default
      setParkMapView(activeParkMapView);
    }

    // Switch Between the 3 Park Map Modes: Illustrated Park Map | Aerial Coaster Map | Official Map Brochure
    function setParkMapView(mode) {
      activeParkMapView = mode;
      const park = PARKS_DATA.find(p => p.id === activeParkId);
      if (!park) return;

      ["illustrated", "satellite", "official"].forEach(m => {
        const btn = document.getElementById(`pmode-${m}`);
        btn.className = m === mode
          ? "flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-accent-600 text-white font-semibold transition"
          : "flex items-center gap-1.5 px-3 py-1.5 rounded-lg hover:text-white transition";
      });

      const illusStage = document.getElementById("illustrated-map-stage");
      const brochureStage = document.getElementById("official-brochure-stage");

      if (mode === "illustrated") {
        illusStage.classList.remove("hidden");
        brochureStage.classList.add("hidden");
        renderIllustratedParkMap(park);
      } else if (mode === "satellite") {
        illusStage.classList.add("hidden");
        brochureStage.classList.add("hidden");
        applyWorldBasemap();
        map.invalidateSize();
        map.flyTo(park.coords, park.zoom, { duration: 0.9 });
      } else if (mode === "official") {
        illusStage.classList.add("hidden");
        brochureStage.classList.remove("hidden");
        renderOfficialBrochureStage(park);
      }
    }

    // Render Bespoke Illustrated Theme Park Map with Themed Lands, Architecture & Interactive Ride Pins
    function renderIllustratedParkMap(park) {
      const svgContainer = document.getElementById("illustrated-svg-layer");
      const pinsContainer = document.getElementById("illustrated-pins-layer");
      const legendContainer = document.getElementById("illustrated-lands-legend");

      // Architectural Background Elements Based on Park Layout Style
      let centerpieceSvg = "";
      if (park.mapStyle === "tri-dome") {
        // Ferrari World Iconic Red Tri-Wing Roof Structure
        centerpieceSvg = `
          <path d="M 500,80 C 620,260 760,340 920,440 C 720,470 590,530 500,610 C 410,530 280,470 80,440 C 240,340 380,260 500,80 Z"
            fill="#dc2626" fill-opacity="0.16" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="8 4" />
          <circle cx="500" cy="390" r="65" fill="#dc2626" fill-opacity="0.22" stroke="#f87171" stroke-width="2" />
        `;
      } else if (park.mapStyle === "lagoon-loop") {
        // Universal Studios Central Lagoon & Pathways
        centerpieceSvg = `
          <ellipse cx="510" cy="320" rx="185" ry="115" fill="#0284c7" fill-opacity="0.28" stroke="#38bdf8" stroke-width="2" />
          <ellipse cx="510" cy="320" rx="285" ry="195" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="6" stroke-dasharray="12 8" />
        `;
      } else if (park.mapStyle === "castle-hub") {
        // Disney Hub-and-Spoke Radiating Pathways & Central Castle
        centerpieceSvg = `
          <circle cx="500" cy="330" r="52" fill="${park.brandColor}" fill-opacity="0.25" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" />
          <line x1="500" y1="330" x2="500" y2="590" stroke="#ffffff" stroke-opacity="0.22" stroke-width="10" />
          <line x1="500" y1="330" x2="220" y2="260" stroke="#ffffff" stroke-opacity="0.15" stroke-width="5" />
          <line x1="500" y1="330" x2="780" y2="260" stroke="#ffffff" stroke-opacity="0.15" stroke-width="5" />
          <line x1="500" y1="330" x2="260" y2="450" stroke="#ffffff" stroke-opacity="0.15" stroke-width="5" />
          <line x1="500" y1="330" x2="760" y2="450" stroke="#ffffff" stroke-opacity="0.15" stroke-width="5" />
        `;
      } else if (park.mapStyle === "mountain-hub") {
        // Canada's Wonderland Wonder Mountain & Coaster Loops
        centerpieceSvg = `
          <polygon points="500,210 585,355 415,355" fill="#64748b" fill-opacity="0.35" stroke="#94a3b8" stroke-width="2" />
          <ellipse cx="500" cy="340" rx="310" ry="200" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="5" stroke-dasharray="10 6" />

      } else {
        // Indoor Plaza & Radial Soundstages
        centerpieceSvg = `
          <rect x="90" y="65" width="820" height="490" rx="48" fill="#18181b" fill-opacity="0.45" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2" />
          <circle cx="500" cy="310" r="70" fill="${park.brandColor}" fill-opacity="0.18" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2" />
        `;
      }

      // Generate Colored Themed Land Zones on the 1000x625 Illustrated Canvas
      const landsSvg = park.lands.map(land => {
        const cx = land.cx * 10;
        const cy = land.cy * 6.25;
        const rx = land.rx * 10;
        const ry = land.ry * 6.25;
        return `
          <g>
            <ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}"
              fill="${land.color}" fill-opacity="0.18"
              stroke="${land.color}" stroke-opacity="0.65" stroke-width="2" />
            <text x="${cx}" y="${cy - ry + 22}" text-anchor="middle"
              fill="${land.color}" font-family="Geist Mono, monospace" font-size="11" font-weight="700" letter-spacing="1.5">
              ${land.name.toUpperCase()}
            </text>
          </g>
        `;
      }).join("");

      svgContainer.innerHTML = `
        <svg viewBox="0 0 1000 625" class="w-full h-full object-cover">
          <defs>
            <radialGradient id="parkGlow" cx="50%" cy="50%" r="60%">
              <stop offset="0%" stop-color="${park.brandColor}" stop-opacity="0.22" />
              <stop offset="100%" stop-color="#09090b" stop-opacity="0.95" />
            </radialGradient>
            <pattern id="mapGrid" width="40" height="40" patternUnits="userSpaceOnUse">
              <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
            </pattern>
          </defs>

          <!-- Base Cartographic Canvas -->
          <rect width="1000" height="625" fill="url(#parkGlow)" />
          <rect width="1000" height="625" fill="url(#mapGrid)" />

          <!-- Park Centerpiece & Pathways -->
          ${centerpieceSvg}

          <!-- Themed Land Zones -->
          ${landsSvg}

          <!-- Main Entrance Gate Marker -->
          <g transform="translate(500, 590)">
            <rect x="-65" y="-14" width="130" height="24" rx="6" fill="#18181b" stroke="rgba(255,255,255,0.25)" />
            <text x="0" y="2" text-anchor="middle" fill="#a1a1aa" font-family="Geist Mono, monospace" font-size="10" font-weight="600">
              PARK ENTRANCE GATE
            </text>
          </g>
        </svg>

        <!-- Park Brand Cartouche in Top-Left of Illustrated Map -->
        <div class="absolute top-16 left-5 flex items-center gap-3 bg-zinc-950/85 backdrop-blur-md border border-white/15 p-2.5 pr-4 rounded-xl shadow-lg pointer-events-none">
          <div class="w-10 h-10 rounded-lg bg-white p-1 flex items-center justify-center shrink-0 overflow-hidden">
            ${getLogoHtml(park)}
          </div>
          <div>
            <div class="font-mono text-[10px] uppercase tracking-wider text-zinc-400">Interactive Illustrated Guide</div>
            <div class="text-sm font-bold text-white">${park.name}</div>
          </div>
        </div>
      `;

      // Render Interactive Ride Pins Directly Over the Illustrated Park Map
      pinsContainer.innerHTML = "";
      const rides = getAllRidesForPark(park);
      rides.forEach((ride, idx) => {
        const isChecked = !!riddenRides[ride.id];
        const pos = ride.mapPos || [30 + ((idx * 17) % 45), 30 + ((idx * 23) % 45)];
        const landObj = park.lands.find(l => l.name === ride.land);
        const landColor = landObj ? landObj.color : park.brandColor;

        const pin = document.createElement("button");
        pin.className = `illus-pin absolute flex items-center gap-1.5 px-2.5 py-1 rounded-full border text-[11px] font-semibold shadow-xl whitespace-nowrap focus:outline-none ${
          isChecked
            ? "bg-emerald-500 border-white text-zinc-950"
            : "bg-zinc-950/95 border-white/25 text-white hover:border-white"
        }`;
        pin.style.left = `${pos[0]}%`;
        pin.style.top = `${pos[1]}%`;
        pin.style.zIndex = isChecked ? "30" : "20";
        pin.onclick = () => toggleRide(ride.id);

        pin.innerHTML = `
          <span class="w-4 h-4 rounded-full flex items-center justify-center text-[10px] font-mono font-bold"
            style="background:${isChecked ? '#052e16' : landColor}; color:#fff">
            ${isChecked ? '<i class="ph-bold ph-check"></i>' : idx + 1}
          </span>
          <span>${ride.name}</span>
        `;
        pinsContainer.appendChild(pin);
      });

      // Render Bottom Themed Lands Key
      legendContainer.innerHTML = park.lands.map(land => `
        <span class="inline-flex items-center gap-1.5 shrink-0 text-[11px] font-medium text-zinc-300">
          <span class="w-2.5 h-2.5 rounded-sm" style="background:${land.color}"></span>
          <span>${land.name}</span>
        </span>
      `).join("");
    }

    function setRideStatusFilter(status) {
      currentRideStatusFilter = status;
      ["all", "ridden", "unridden"].forEach(s => {
        const btn = document.getElementById(`rf-${s}`);
        btn.className = s === status
          ? "px-2.5 py-1 rounded-md bg-zinc-900 text-white dark:bg-zinc-100 dark:text-zinc-900 transition"
          : "px-2.5 py-1 rounded-md text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-200 transition";
      });
      if (activeParkId) {
        renderParkDetailRides(PARKS_DATA.find(p => p.id === activeParkId));
      }
    }

    function renderParkDetailRides(park) {
      const allRides = getAllRidesForPark(park);
      const riddenCount = allRides.filter(r => riddenRides[r.id]).length;
      const pct = allRides.length ? Math.round((riddenCount / allRides.length) * 100) : 0;

      document.getElementById("detail-progress-text").textContent = `${riddenCount} / ${allRides.length} rides logged (${pct}%)`;
      document.getElementById("detail-progress-bar").style.width = `${pct}%`;

      const filtered = allRides.filter(r => {
        if (currentRideStatusFilter === "ridden") return !!riddenRides[r.id];
        if (currentRideStatusFilter === "unridden") return !riddenRides[r.id];
        return true;
      });

      const grouped = {};
      filtered.forEach(r => {
        if (!grouped[r.land]) grouped[r.land] = [];
        grouped[r.land].push(r);
      });

      const container = document.getElementById("detail-rides-container");
      container.innerHTML = "";

      Object.entries(grouped).forEach(([land, landRides]) => {
        const landDone = landRides.filter(r => riddenRides[r.id]).length;
        const landObj = park.lands.find(l => l.name === land);
        const badgeColor = landObj ? landObj.color : park.brandColor;

        const section = document.createElement("div");
        section.innerHTML = `
          <div class="flex items-center justify-between mb-2">
            <div class="flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-sm" style="background:${badgeColor}"></span>
              <span class="font-mono text-[11px] font-bold uppercase tracking-wider text-zinc-700 dark:text-zinc-300">${land}</span>
            </div>
            <span class="font-mono text-[11px] text-zinc-400 tabular-nums">${landDone}/${landRides.length}</span>
          </div>
        `;

        const list = document.createElement("div");
        list.className = "space-y-1.5";

        landRides.forEach(ride => {
          const isChecked = !!riddenRides[ride.id];
          const item = document.createElement("div");
          item.className = `group flex items-center justify-between px-3 py-2.5 rounded-xl border cursor-pointer transition-all ${
            isChecked
              ? "bg-emerald-500/10 border-emerald-500/40"
              : "bg-zinc-50/60 dark:bg-zinc-900/50 border-zinc-200/70 dark:border-zinc-800/80 hover:border-zinc-400 dark:hover:border-zinc-700"
          }`;
          item.onclick = () => toggleRide(ride.id);

          item.innerHTML = `
            <div class="flex items-center gap-3 min-w-0">
              <div class="w-5 h-5 rounded-md flex items-center justify-center border transition shrink-0 ${
                isChecked
                  ? "bg-emerald-500 border-emerald-500 text-zinc-950"
                  : "border-zinc-300 dark:border-zinc-700 text-transparent group-hover:border-zinc-400"
              }">
                <i class="ph-bold ph-check text-xs"></i>
              </div>
              <div class="min-w-0">
                <div class="text-xs font-semibold text-zinc-900 dark:text-zinc-100 truncate">${ride.name}</div>
                <div class="text-[11px] text-zinc-500 dark:text-zinc-400 truncate">${ride.type}</div>
              </div>
            </div>
            <button onclick="event.stopPropagation(); focusRideOnAerialMap('${ride.id}')" title="View on Aerial Coaster Map"
              class="shrink-0 ml-2 w-7 h-7 rounded-lg hover:bg-zinc-200/70 dark:hover:bg-zinc-800 flex items-center justify-center text-zinc-400 hover:text-zinc-900 dark:hover:text-white transition">
              <i class="ph-bold ph-crosshair text-xs"></i>
            </button>
          `;
          list.appendChild(item);
        });

        section.appendChild(list);
        container.appendChild(section);
      });
    }

    // Aerial Satellite Coaster Pins & Land Zones
    function renderParkRideMarkers(park) {
      rideMarkersGroup.clearLayers();
      landPolygonsGroup.clearLayers();
      const rides = getAllRidesForPark(park);

      rides.forEach((ride, idx) => {
        const isChecked = !!riddenRides[ride.id];
        const lat = park.coords[0] + (ride.offset ? ride.offset[0] : 0);
        const lng = park.coords[1] + (ride.offset ? ride.offset[1] : 0);

        const pinHtml = `
          <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full border text-[11px] font-semibold whitespace-nowrap shadow-xl transition-transform hover:scale-105 ${
            isChecked
              ? "bg-emerald-500 border-white text-zinc-950"
              : "bg-zinc-950/95 border-white/30 text-white"
          }">
            <span class="font-mono text-[10px] font-bold">${isChecked ? '✓' : idx + 1}</span>
            <span>${ride.name}</span>
          </div>
        `;
        const icon = L.divIcon({ html: pinHtml, className: "", iconAnchor: [45, 14] });
        const marker = L.marker([lat, lng], { icon }).addTo(rideMarkersGroup);
        marker.rideId = ride.id;

        marker.bindPopup(`
          <div class="min-w-[190px]">
            <div class="font-mono text-[10px] uppercase tracking-wider text-accent-400 font-bold">${ride.land}</div>
            <div class="text-xs font-bold text-white mt-0.5">${ride.name}</div>
            <div class="text-[11px] text-zinc-400 mb-3">${ride.type}</div>
            <button onclick="toggleRide('${ride.id}')" class="w-full py-1.5 px-2.5 rounded-lg text-xs font-semibold flex items-center justify-center gap-1.5 transition ${
              isChecked ? "bg-zinc-800 hover:bg-zinc-700 text-zinc-200" : "bg-emerald-500 hover:bg-emerald-400 text-zinc-950"
            }">
              <i class="ph-bold ${isChecked ? 'ph-x' : 'ph-check'} text-xs"></i>
              <span>${isChecked ? "Remove Credit" : "Log Ride Credit"}</span>
            </button>
          </div>
        `);
      });
    }

    function focusRideOnAerialMap(rideId) {
      if (!activeParkId) return;
      const park = PARKS_DATA.find(p => p.id === activeParkId);
      const ride = getAllRidesForPark(park).find(r => r.id === rideId);
      if (!ride) return;

      if (window.innerWidth < 1024) switchMobileTab("map");
      setParkMapView("satellite");

      const lat = park.coords[0] + (ride.offset ? ride.offset[0] : 0);
      const lng = park.coords[1] + (ride.offset ? ride.offset[1] : 0);
      map.flyTo([lat, lng], 18, { duration: 0.7 });

      rideMarkersGroup.eachLayer(layer => {
        if (layer.rideId === rideId) layer.openPopup();
      });
    }

    function toggleRide(rideId) {
      riddenRides[rideId] = !riddenRides[rideId];
      localStorage.setItem("ctc_ridden_rides", JSON.stringify(riddenRides));
      updateGlobalStats();
      if (activeParkId) {
        const park = PARKS_DATA.find(p => p.id === activeParkId);
        renderParkDetailRides(park);
        renderParkRideMarkers(park);
        if (activeParkMapView === "illustrated") {
          renderIllustratedParkMap(park);
        }
      } else {
        renderGlobalMarkers();
      }
    }

    function toggleAllParkRides() {
      if (!activeParkId) return;
      const park = PARKS_DATA.find(p => p.id === activeParkId);
      const rides = getAllRidesForPark(park);
      const allDone = rides.every(r => riddenRides[r.id]);
      rides.forEach(r => { riddenRides[r.id] = !allDone; });
      localStorage.setItem("ctc_ridden_rides", JSON.stringify(riddenRides));
      updateGlobalStats();
      renderParkDetailRides(park);
      renderParkRideMarkers(park);
      if (activeParkMapView === "illustrated") {
        renderIllustratedParkMap(park);
      }
    }

    function toggleAddRideDrawer() {
      document.getElementById("custom-ride-drawer").classList.toggle("hidden");
    }

    function addCustomRide() {
      if (!activeParkId) return;
      const nameInput = document.getElementById("new-ride-name");
      const landInput = document.getElementById("new-ride-land");
      const name = nameInput.value.trim();
      const park = PARKS_DATA.find(p => p.id === activeParkId);
      const land = landInput.value.trim() || (park.lands[0] ? park.lands[0].name : "Park Attraction");
      if (!name) return;

      if (!customRides[activeParkId]) customRides[activeParkId] = [];
      const newId = `custom-${Date.now()}`;
      customRides[activeParkId].push({
        id: newId,
        name,
        land,
        type: "Custom Logged Attraction",
        offset: [(Math.random() - 0.5) * 0.002, (Math.random() - 0.5) * 0.002],
        mapPos: [35 + Math.floor(Math.random() * 30), 35 + Math.floor(Math.random() * 30)]
      });
      riddenRides[newId] = true;

      localStorage.setItem("ctc_custom_rides", JSON.stringify(customRides));
      localStorage.setItem("ctc_ridden_rides", JSON.stringify(riddenRides));

      nameInput.value = "";
      landInput.value = "";
      document.getElementById("custom-ride-drawer").classList.add("hidden");

      renderParkDetailRides(park);
      renderParkRideMarkers(park);
      if (activeParkMapView === "illustrated") renderIllustratedParkMap(park);
      updateGlobalStats();
    }

    function resetWorldView() {
      activeParkId = null;
      rideMarkersGroup.clearLayers();
      landPolygonsGroup.clearLayers();
      document.getElementById("view-park-detail").classList.add("hidden");
      document.getElementById("view-directory").classList.remove("hidden");
      document.getElementById("world-reset-btn").classList.add("hidden");
      document.getElementById("world-reset-btn").classList.remove("inline-flex");
      document.getElementById("park-map-toolbar").classList.add("hidden");
      document.getElementById("illustrated-map-stage").classList.add("hidden");
      document.getElementById("official-brochure-stage").classList.add("hidden");
      document.getElementById("header-context").textContent = "World Park Atlas";

      applyWorldBasemap();
      map.invalidateSize();
      map.flyTo([25, 45], 3, { duration: 1.0 });
      renderParkDirectory();
      renderGlobalMarkers();
    }

    function switchMobileTab(tab) {
      const drawer = document.getElementById("left-drawer");
      const mapWorkspace = document.getElementById("map-workspace");
      const tabList = document.getElementById("mob-tab-list");
      const tabMap = document.getElementById("mob-tab-map");

      const activeClass = "flex items-center justify-center gap-2 rounded-lg text-xs font-semibold bg-zinc-900 text-white dark:bg-zinc-100 dark:text-zinc-900";
      const inactiveClass = "flex items-center justify-center gap-2 rounded-lg text-xs font-semibold text-zinc-500 dark:text-zinc-400";

      tabList.className = tab === "list" ? activeClass : inactiveClass;
      tabMap.className = tab === "map" ? activeClass : inactiveClass;

      if (tab === "list") {
        drawer.classList.remove("hidden");
        mapWorkspace.classList.add("hidden");
      } else {
        drawer.classList.add("hidden");
        mapWorkspace.classList.remove("hidden");
        mapWorkspace.classList.add("flex");
        setTimeout(() => map.invalidateSize(), 50);
      }
    }

    window.addEventListener("resize", () => {
      if (window.innerWidth >= 1024) {
        document.getElementById("left-drawer").classList.remove("hidden");
        document.getElementById("map-workspace").classList.remove("hidden");
      }
      map.invalidateSize();
    });

    // Boot Coaster to Coaster
    renderParkDirectory();
    renderGlobalMarkers();
    updateGlobalStats();
  </script>
</body>
</html>
