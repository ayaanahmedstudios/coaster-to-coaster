<body class="h-[100dvh] w-screen overflow-hidden flex flex-col bg-[#faf9f6] text-stone-900 dark:bg-[#0b0c10] dark:text-stone-100 select-none antialiased transition-colors duration-300">

  <header class="h-14 shrink-0 bg-[#faf9f6]/90 dark:bg-[#0b0c10]/90 backdrop-blur-md border-b border-stone-200/80 dark:border-stone-800/80 px-4 lg:px-6 flex items-center justify-between gap-4 z-30">

      <button onclick="resetWorldView()" class="text-left focus:outline-none group flex items-center gap-2">
        <i class="ph-bold ph-pinwheel text-rosebrand-500 text-lg group-hover:rotate-90 transition-transform duration-500"></i>
        <span class="text-base font-bold tracking-[-0.03em] text-stone-900 dark:text-white">

      <span class="text-stone-300 dark:text-stone-700">/</span>

        World Archive

    </div>

    <div class="hidden md:flex items-center bg-stone-200/60 dark:bg-stone-900 p-1 rounded-full border border-stone-200/80 dark:border-stone-800 text-xs">
      <button onclick="setCategoryFilter('core')" id="btn-cat-core" class="px-3.5 py-1 rounded-full font-semibold transition-all bg-white dark:bg-stone-800 text-stone-900 dark:text-white shadow-sm">

      </button>
      <button onclick="setCategoryFilter('all')" id="btn-cat-all" class="px-3.5 py-1 rounded-full font-semibold text-stone-500 dark:text-stone-400 hover:text-stone-900 dark:hover:text-white transition-all">
        Complete Archive <span class="font-mono text-[11px] opacity-60 ml-1">16</span>
      </button>
    </div>

    <div class="flex items-center gap-2">
      <button onclick="resetWorldView()" id="world-reset-btn" class="hidden items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-stone-900 text-white dark:bg-white dark:text-stone-900 text-xs font-semibold hover:opacity-90 transition shadow-sm">
        <i class="ph-bold ph-globe-hemisphere-east text-sm"></i>
        <span>World Map</span>
      </button>
      <button onclick="toggleTheme()" class="w-8 h-8 rounded-full hover:bg-stone-200/60 dark:hover:bg-stone-800 flex items-center justify-center text-stone-600 dark:text-stone-300 transition">
        <i id="theme-icon" class="ph-bold ph-moon text-base"></i>
      </button>
    </div>
  </header>

  <div class="flex-1 flex overflow-hidden relative">

          <button onclick="setCategoryFilter('all')" id="m-btn-cat-all" class="flex-1 py-1.5 rounded-full text-xs font-semibold bg-stone-200/70 dark:bg-stone-900 text-stone-500 dark:text-stone-400">

        </div>

        <div class="p-4 border-b border-stone-200/70 dark:border-stone-800/80 space-y-3">

            <button onclick="setRegionFilter('ASIA')" data-region="ASIA" class="region-pill shrink-0 px-3 py-1 rounded-full bg-stone-200/60 dark:bg-stone-900 text-stone-600 dark:text-stone-400 hover:bg-stone-200 dark:hover:bg-stone-800 transition">

            </button>
            <button onclick="setRegionFilter('NA')" data-region="NA" class="region-pill shrink-0 px-3 py-1 rounded-full bg-stone-200/60 dark:bg-stone-900 text-stone-600 dark:text-stone-400 hover:bg-stone-200 dark:hover:bg-stone-800 transition">

            </button>
            <button onclick="setRegionFilter('UK')" data-region="UK" class="region-pill shrink-0 px-3 py-1 rounded-full bg-stone-200/60 dark:bg-stone-900 text-stone-600 dark:text-stone-400 hover:bg-stone-200 dark:hover:bg-stone-800 transition">

          </div>
        </div>

        <div id="modal-map-body" class="flex-1 overflow-auto thin-scroll flex items-center justify-center p-4 sm:p-6"></div>
      </div>

    function isDarkMode() {
      return document.documentElement.classList.contains("dark");
    }

    function updateMapTiles() {
      Object.values(tileLayers).forEach(l => map.removeLayer(l));
      if (!activeParkId) {
        (isDarkMode() ? tileLayers.darkMatter : tileLayers.voyager).addTo(map);
      } else {
        if (activeMapLayerMode === "satellite") {
          tileLayers.satellite.addTo(map);
        } else {
          tileLayers.osmPark.addTo(map);
        }
      }
    }

      document.getElementById("theme-icon").className = dark ? "ph-bold ph-sun text-base" : "ph-bold ph-moon text-base";
      updateMapTiles();

        const markerHtml = `

            <span class="font-mono text-[10px] font-semibold px-1.5 py-0.5 rounded-full text-white tabular-nums" style="background:${park.brandColor}">${riddenCount}/${park.rides.length}</span>

        `;
        const icon = L.divIcon({ html: markerHtml, className: "", iconAnchor: [75, 18] });
        const marker = L.marker(park.coords, { icon }).addTo(parkMarkersGroup);
        marker.on("click", () => selectPark(park.id));

    async function fetchRealCoasterTracks(park) {
      coasterTracksGroup.clearLayers();
      const labelEl = document.getElementById("coaster-track-label");
      labelEl.textContent = "Mapping Coaster Tracks...";

      if (overpassCache[park.id]) {
        drawOverpassGeometry(overpassCache[park.id], park.brandColor);
        return;
      }

      const d = 0.008;
      const bbox = `${park.coords[0] - d},${park.coords[1] - d},${park.coords[0] + d},${park.coords[1] + d}`;
      const query = `[out:json][timeout:10];(way["roller_coaster"](${bbox});way["attraction"="roller_coaster"](${bbox});way["railway"="narrow_gauge"](${bbox}););out geom;`;

      try {
        const res = await fetch("https://overpass-api.de/api/interpreter?data=" + encodeURIComponent(query));
        const data = await res.json();
        overpassCache[park.id] = data.elements || [];
        if (activeParkId === park.id) {
          drawOverpassGeometry(overpassCache[park.id], park.brandColor);
        }
      } catch (e) {
        labelEl.textContent = `${park.rides.length} Park Attractions Mapped`;
      }
    }

    function drawOverpassGeometry(elements, color) {
      coasterTracksGroup.clearLayers();
      let count = 0;
      elements.forEach(el => {
        if (el.geometry && el.geometry.length > 1) {
          const latlngs = el.geometry.map(pt => [pt.lat, pt.lon]);
          L.polyline(latlngs, {
            color: color,
            weight: 4,
            opacity: 0.85,
            lineCap: "round"
          }).addTo(coasterTracksGroup);
          count++;
        }
      });
      const labelEl = document.getElementById("coaster-track-label");
      labelEl.textContent = count > 0 ? `${count} Live Coaster Tracks Highlighted` : "Park Layout Active";
    }

                  <i class="ph-bold ph-map-trifold text-base"></i>
                  <span>Open Official ${park.shortName} Map</span>
                  <i class="ph-bold ph-arrow-up-right"></i>
                </a>
                <button onclick="closeOfficialMapSheet()"
                  class="w-full py-2.5 px-4 rounded-2xl bg-white/10 hover:bg-white/15 text-stone-200 text-xs font-semibold transition">
                  Return to Interactive Park Map
                </button>
              </div>
            </div>
          </div>
        `;
      }

      const modal = document.getElementById("official-map-modal");
      modal.classList.remove("hidden");
      gsap.fromTo(modal, { opacity: 0 }, { opacity: 1, duration: 0.25 });
    }

    function closeOfficialMapSheet() {
      document.getElementById("official-map-modal").classList.add("hidden");
    }

    function setRideStatusFilter(status) {
      currentRideStatusFilter = status;
      ["all", "ridden", "unridden"].forEach(s => {
        const btn = document.getElementById(`rf-${s}`);
        btn.className = s === status
          ? "px-3 py-1 rounded-full bg-stone-900 text-white dark:bg-white dark:text-stone-900 transition"
          : "px-3 py-1 rounded-full text-stone-500 dark:text-stone-400 hover:text-stone-900 dark:hover:text-white transition";
      });
      if (activeParkId) {
        renderParkDetailRides(PARKS_DATA.find(p => p.id === activeParkId));
      }
    }

    function renderParkDetailRides(park) {
      const riddenCount = park.rides.filter(r => riddenRides[r.id]).length;
      const pct = Math.round((riddenCount / park.rides.length) * 100);

      document.getElementById("detail-progress-text").textContent = `${riddenCount} of ${park.rides.length} experienced (${pct}%)`;
      document.getElementById("detail-progress-bar").style.width = `${pct}%`;

      const filtered = park.rides.filter(r => {
        if (currentRideStatusFilter === "ridden") return !!riddenRides[r.id];
        if (currentRideStatusFilter === "unridden") return !riddenRides[r.id];
        return true;
      });

      const grouped = {};
      filtered.forEach(r => {
        if (!grouped[r.land]) grouped[r.land] = [];
        grouped[r.land].push(r);
      });

      const container = document.getElementById("detail-rides-container");
      container.innerHTML = "";

      Object.entries(grouped).forEach(([land, landRides]) => {
        const landDone = landRides.filter(r => riddenRides[r.id]).length;
        const section = document.createElement("div");
        section.innerHTML = `
          <div class="flex items-center justify-between mb-2">
            <div class="flex items-center gap-2">
              <span class="w-2 h-2 rounded-full" style="background:${park.brandColor}"></span>
              <span class="text-xs font-bold tracking-tight text-stone-700 dark:text-stone-300">${land}</span>
            </div>
            <span class="font-mono text-[11px] text-stone-400 tabular-nums">${landDone}/${landRides.length}</span>
          </div>
        `;

        const list = document.createElement("div");
        list.className = "space-y-2";

        landRides.forEach(ride => {
          const isChecked = !!riddenRides[ride.id];
          const isFav = !!favoriteRides[ride.id];
          const globalIdx = park.rides.findIndex(x => x.id === ride.id) + 1;

          const item = document.createElement("div");
          item.className = `ride-row group flex items-center justify-between p-3 rounded-2xl border cursor-pointer transition-all ${
            isChecked
              ? "bg-white dark:bg-stone-900 border-stone-300 dark:border-stone-700 shadow-sm"
              : "bg-white/50 dark:bg-stone-900/40 border-stone-200/70 dark:border-stone-800/80 hover:border-stone-300 dark:hover:border-stone-700"
          }`;
          item.onclick = () => toggleRide(ride.id);

          item.innerHTML = `
            <div class="flex items-center gap-3 min-w-0">
              <div class="w-6 h-6 rounded-full flex items-center justify-center font-mono text-[11px] font-bold shrink-0 transition-all"
                style="background:${isChecked ? park.brandColor : 'rgba(156,163,175,0.18)'}; color:${isChecked ? '#ffffff' : 'inherit'}">
                ${isChecked ? '<i class="ph-bold ph-check text-xs"></i>' : globalIdx}
              </div>
              <div class="min-w-0">
                <div class="text-xs font-bold text-stone-900 dark:text-white truncate">${ride.name}</div>
                <div class="text-[11px] text-stone-500 dark:text-stone-400 truncate">${ride.type}</div>
              </div>
            </div>
            <div class="flex items-center gap-1 shrink-0 ml-2">
              <button onclick="event.stopPropagation(); toggleFavoriteRide('${ride.id}')" title="Favorite Memory"
                class="w-7 h-7 rounded-full hover:bg-stone-100 dark:hover:bg-stone-800 flex items-center justify-center transition ${
                  isFav ? 'text-rosebrand-500' : 'text-stone-300 dark:text-stone-600 hover:text-rosebrand-400'
                }">
                <i class="${isFav ? 'ph-fill' : 'ph-bold'} ph-heart text-xs"></i>
              </button>
              <button onclick="event.stopPropagation(); focusRidePin('${ride.id}')" title="Locate on Park Map"
                class="w-7 h-7 rounded-full hover:bg-stone-100 dark:hover:bg-stone-800 flex items-center justify-center text-stone-400 hover:text-stone-900 dark:hover:text-white transition">
                <i class="ph-bold ph-crosshair text-xs"></i>
              </button>
            </div>
          `;
          list.appendChild(item);
        });

        section.appendChild(list);
        container.appendChild(section);
      });
    }

    function renderParkRideMarkers(park) {
      rideMarkersGroup.clearLayers();

      park.rides.forEach((ride, idx) => {
        const isChecked = !!riddenRides[ride.id];
        const isFav = !!favoriteRides[ride.id];

        const pinHtml = `
          <div class="ride-pin-pill inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full border text-[11px] font-bold whitespace-nowrap shadow-xl cursor-pointer"
            style="background:${isChecked ? park.brandColor : '#111827'}; border-color:rgba(255,255,255,0.45); color:#ffffff">
            <span class="font-mono text-[10px] opacity-90">${isChecked ? '✓' : idx + 1}</span>
            <span>${ride.name}</span>
            ${isFav ? '<i class="ph-fill ph-heart text-[10px] text-rose-200"></i>' : ''}
          </div>
        `;
        const icon = L.divIcon({ html: pinHtml, className: "", iconAnchor: [55, 14] });
        const marker = L.marker([ride.lat, ride.lng], { icon }).addTo(rideMarkersGroup);
        marker.rideId = ride.id;

        marker.bindPopup(`
          <div class="min-w-[200px]">
            <div class="font-mono text-[10px] uppercase tracking-wider text-stone-400 font-semibold">${ride.land}</div>
            <div class="text-sm font-bold text-white mt-0.5">${ride.name}</div>
            <div class="text-xs text-stone-300 mb-3">${ride.type}</div>
            <button onclick="toggleRide('${ride.id}')" class="w-full py-2 px-3 rounded-xl text-xs font-bold text-white flex items-center justify-center gap-1.5 transition"
              style="background:${isChecked ? '#374151' : park.brandColor}">
              <i class="ph-bold ${isChecked ? 'ph-x' : 'ph-check'} text-xs"></i>
              <span>${isChecked ? "Unmark Ride" : "Mark as Experienced"}</span>
            </button>
          </div>
        `);
      });
    }

    function focusRidePin(rideId) {
      if (!activeParkId) return;
      const park = PARKS_DATA.find(p => p.id === activeParkId);
      const ride = park.rides.find(r => r.id === rideId);
      if (!ride) return;

      if (window.innerWidth < 1024) switchMobileTab("map");
      closeOfficialMapSheet();

      map.flyTo([ride.lat, ride.lng], 18, { duration: 0.7 });
      rideMarkersGroup.eachLayer(layer => {
        if (layer.rideId === rideId) layer.openPopup();
      });
    }

    function toggleRide(rideId) {
      riddenRides[rideId] = !riddenRides[rideId];
      localStorage.setItem("ctc_ridden_rides", JSON.stringify(riddenRides));
      if (activeParkId) {
        const park = PARKS_DATA.find(p => p.id === activeParkId);
        renderParkDetailRides(park);
        renderParkRideMarkers(park);
      } else {
        renderGlobalMarkers();
      }
    }

    function toggleFavoriteRide(rideId) {
      favoriteRides[rideId] = !favoriteRides[rideId];
      localStorage.setItem("ctc_fav_rides", JSON.stringify(favoriteRides));
      if (activeParkId) {
        const park = PARKS_DATA.find(p => p.id === activeParkId);
        renderParkDetailRides(park);
        renderParkRideMarkers(park);
      }
    }

    function toggleAllParkRides() {
      if (!activeParkId) return;
      const park = PARKS_DATA.find(p => p.id === activeParkId);
      const allDone = park.rides.every(r => riddenRides[r.id]);
      park.rides.forEach(r => { riddenRides[r.id] = !allDone; });
      localStorage.setItem("ctc_ridden_rides", JSON.stringify(riddenRides));
      renderParkDetailRides(park);
      renderParkRideMarkers(park);
    }

    function resetWorldView() {
      activeParkId = null;
      rideMarkersGroup.clearLayers();
      coasterTracksGroup.clearLayers();
      closeOfficialMapSheet();

      document.getElementById("view-park-detail").classList.add("hidden");
      document.getElementById("view-directory").classList.remove("hidden");
      document.getElementById("world-reset-btn").classList.add("hidden");
      document.getElementById("world-reset-btn").classList.remove("inline-flex");
      document.getElementById("park-map-Floating-bar").classList.add("hidden");
      document.getElementById("header-breadcrumb").textContent = "World Archive";

      updateMapTiles();
      map.invalidateSize();
      map.flyTo([25, 45], 3, { duration: 1.0 });
      renderParkDirectory();
      renderGlobalMarkers();
    }

    function switchMobileTab(tab) {
      const drawer = document.getElementById("left-drawer");
      const mapWorkspace = document.getElementById("map-workspace");
      const tabList = document.getElementById("mob-tab-list");
      const tabMap = document.getElementById("mob-tab-map");

      const activeClass = "flex items-center justify-center gap-2 rounded-full text-xs font-bold bg-stone-900 text-white dark:bg-white dark:text-stone-900";
      const inactiveClass = "flex items-center justify-center gap-2 rounded-full text-xs font-bold text-stone-500 dark:text-stone-400";

      tabList.className = tab === "list" ? activeClass : inactiveClass;
      tabMap.className = tab === "map" ? activeClass : inactiveClass;

      if (tab === "list") {
        drawer.classList.remove("hidden");
        mapWorkspace.classList.add("hidden");
      } else {
        drawer.classList.add("hidden");
        mapWorkspace.classList.remove("hidden");
        mapWorkspace.classList.add("flex");
        setTimeout(() => map.invalidateSize(), 50);
      }
    }

    window.addEventListener("resize", () => {
      if (window.innerWidth >= 1024) {
        document.getElementById("left-drawer").classList.remove("hidden");
        document.getElementById("map-workspace").classList.remove("hidden");
      }
      map.invalidateSize();
    });

    renderParkDirectory();
    renderGlobalMarkers();
  </script>
</body>
</html>
