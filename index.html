:root {
  --bg: #2230e8;
  --ink: #15120d;
  --pc: #ffd21f;
  --yellow: #ffd21f;
  --display: 'Bricolage Grotesque', 'Arial Narrow', Impact, sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
  font-family: 'DM Sans', system-ui, sans-serif; font-weight: 500; font-size: 15px; line-height: 1.35;
  background: var(--bg); color: #fff;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
button:focus-visible, a:focus-visible, .ride:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.park-card:focus-visible, .ticket:focus-visible { outline-color: var(--yellow); }
.ic { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ico { display: inline-flex; align-items: center; justify-content: center; }
.disp { font-family: var(--display); font-weight: 800; font-stretch: 75%; letter-spacing: -0.005em; }

#app { flex: 1; display: flex; flex-direction: column; min-height: 0; position: relative; }
#panel { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
#mapwrap { display: none; position: relative; flex: 1; min-height: 0; background: #c4ccff; }
#map, #plan { position: absolute; inset: 0; z-index: 1; }
#map { background: #c4ccff; }
#plan { background: radial-gradient(rgba(21, 18, 13, 0.14) 1.5px, transparent 1.6px) 0 0 / 22px 22px, color-mix(in srgb, var(--pc) 34%, #fff); }
body[data-view="park"] #map, body[data-view="home"] #plan { display: none; }

body[data-view="home"][data-tab="map"] #panel { display: none; }
body[data-view="home"][data-tab="map"] #mapwrap { display: block; }
body[data-view="park"] #mapwrap { display: block; flex: none; height: 38%; order: -1; transition: height 0.3s ease; }
body[data-view="park"][data-expanded="1"] #mapwrap { height: 76%; }
body[data-view="park"] #panel { background: var(--pc); color: var(--ink); border-radius: 22px 22px 0 0; margin-top: -22px; z-index: 5; overflow: hidden; }

@media (min-width: 1024px) {
  #app { flex-direction: row; padding: 16px; gap: 16px; }
  #panel { flex: none; width: 470px; }
  #mapwrap, body[data-view="home"][data-tab="map"] #mapwrap, body[data-view="park"] #mapwrap { display: block; flex: 1; height: auto; order: 0; border-radius: 14px; overflow: hidden; }
  body[data-view="home"][data-tab="map"] #panel { display: flex; }
  body[data-view="park"] #panel { border-radius: 14px; margin-top: 0; }
  body[data-view="park"][data-expanded="1"] #mapwrap { height: auto; }
  nav.bottom, .expand-btn { display: none !important; }
}

.scroll { overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, 0.35) transparent; }
body[data-view="park"] .scroll { scrollbar-color: rgba(21, 18, 13, 0.35) transparent; }

#home { display: flex; flex-direction: column; flex: 1; min-height: 0; }
#home .scroll { flex: 1; padding: 0 18px 28px; }
body[data-view="park"] #home, body[data-view="home"] #detail { display: none; }

.wordmark { font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: clamp(52px, 17vw, 72px); line-height: 0.86; letter-spacing: -0.015em; margin: calc(26px + var(--safe-t)) 0 12px; }
.lede { font-size: 15px; font-weight: 500; max-width: 30ch; opacity: 0.9; margin-bottom: 22px; }

.perf { position: relative; border-top: 2px dashed rgba(21, 18, 13, 0.45); margin: 0 -18px; }
.perf::before, .perf::after { content: ""; position: absolute; top: -11px; width: 20px; height: 20px; border-radius: 50%; background: var(--bg); }
.perf::before { left: -10px; }
.perf::after { right: -10px; }

.punch { position: relative; overflow: hidden; background: var(--yellow); color: var(--ink); border-radius: 14px; padding: 18px; margin-bottom: 22px; }
.punch-top { display: flex; align-items: flex-end; gap: 12px; }
.punch-top b { font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 76px; line-height: 0.78; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.punch-top span { font-weight: 700; font-size: 15px; line-height: 1.15; }
.punch-sub { font-weight: 500; font-size: 14px; margin: 14px 0 16px; }
.punch .holes { margin-top: 16px; }

.holes { display: flex; flex-wrap: wrap; gap: 5px; }
.h { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 2px rgba(21, 18, 13, 0.38); flex: none; }
.h.on { background: var(--ink); box-shadow: none; }
.holes.sm { gap: 4px; }
.holes.sm .h { width: 10px; height: 10px; }

.controls { display: flex; flex-direction: column; gap: 12px; margin-bottom: 18px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; border: 2px solid #fff; border-radius: 10px; overflow: hidden; }
.seg button { min-height: 46px; font-weight: 700; font-size: 15px; }
.seg button.on { background: #fff; color: var(--ink); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -18px; padding: 0 18px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 40px; padding: 0 15px; border: 2px solid rgba(255, 255, 255, 0.55); border-radius: 8px; font-weight: 700; font-size: 14px; color: #fff; }
.chip.on { background: #fff; border-color: #fff; color: var(--ink); }

.park-list { display: grid; gap: 14px; }
@media (min-width: 640px) and (max-width: 1023px) { .park-list { grid-template-columns: 1fr 1fr; } }
.ticket { position: relative; display: grid; grid-template-columns: 1fr 86px; width: 100%; min-height: 132px; text-align: left; background: var(--s); color: var(--ink); border-radius: 14px; overflow: hidden; transition: transform 0.15s; }
.ticket:hover { transform: translateY(-2px); }
.ticket:active { transform: scale(0.985); }
.t-main { display: flex; flex-direction: column; justify-content: space-between; gap: 16px; padding: 16px 14px 16px 18px; min-width: 0; }
.t-city { display: block; font-size: 13px; font-weight: 600; opacity: 0.75; }
.t-name { display: block; margin-top: 5px; font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 30px; line-height: 0.93; letter-spacing: -0.005em; }
.t-stub { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-left: 2px dashed rgba(21, 18, 13, 0.5); padding: 0 6px; text-align: center; }
.t-stub::before, .t-stub::after { content: ""; position: absolute; left: -11px; width: 20px; height: 20px; border-radius: 50%; background: var(--bg); }
.t-stub::before { top: -10px; }
.t-stub::after { bottom: -10px; }
.t-stub b { font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 44px; line-height: 0.85; font-variant-numeric: tabular-nums; }
.t-stub i { font-style: normal; font-size: 12px; font-weight: 700; opacity: 0.8; line-height: 1.1; }
.t-stub .ic { width: 36px; height: 36px; stroke-width: 3; }
.ticket.done .t-stub { background: var(--ink); color: var(--s); }
.ticket.done .t-stub i { opacity: 1; }
.empty { padding: 36px 4px; font-weight: 600; opacity: 0.85; }

#detail { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.d-head { position: relative; flex: none; padding: 18px 18px 18px; border-bottom: 2px dashed rgba(21, 18, 13, 0.45); z-index: 2; }
.d-head::before, .d-head::after { content: ""; position: absolute; bottom: -11px; width: 20px; height: 20px; border-radius: 50%; background: var(--bg); }
.d-head::before { left: -10px; }
.d-head::after { right: -10px; }
.d-top { display: flex; align-items: flex-start; gap: 14px; }
.back { width: 42px; height: 42px; flex: none; display: grid; place-items: center; border: 2px solid var(--ink); border-radius: 10px; }
.d-title { min-width: 0; padding-top: 1px; }
.d-title h2 { font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 34px; line-height: 0.9; letter-spacing: -0.005em; }
.d-title p { margin-top: 6px; font-size: 13px; font-weight: 600; opacity: 0.75; }
.d-meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.d-meta b { font-weight: 700; font-size: 15px; }
.d-actions { display: flex; gap: 8px; }
.btn { display: inline-flex; align-items: center; gap: 7px; min-height: 42px; padding: 0 14px; border: 2px solid var(--ink); border-radius: 10px; font-weight: 700; font-size: 14px; white-space: nowrap; }
.btn.solid { background: var(--ink); color: var(--pc); }
.d-head .holes { margin-top: 16px; }
.d-head .h { width: 12px; height: 12px; }

.d-list { flex: 1; padding: 6px 18px calc(30px + var(--safe-b)); }
.group { padding-top: 20px; }
.land { font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 24px; line-height: 1; letter-spacing: -0.005em; margin-bottom: 4px; }
.ride { display: flex; align-items: center; gap: 14px; min-height: 64px; cursor: pointer; border-bottom: 2px dashed rgba(21, 18, 13, 0.28); }
.group .ride:last-child { border-bottom: 0; }
.hole { width: 32px; height: 32px; flex: none; display: grid; place-items: center; border: 2.5px solid var(--ink); border-radius: 50%; color: transparent; transition: background 0.15s; }
.hole .ic { width: 16px; height: 16px; stroke-width: 3.6; }
.ride.on .hole { background: var(--ink); color: var(--pc); }
.ride.fresh .hole { animation: punch 0.35s cubic-bezier(0.3, 1.6, 0.5, 1); }
@keyframes punch { 0% { transform: scale(1.55); } 100% { transform: scale(1); } }
.ride .num { font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 15px; width: 20px; opacity: 0.5; flex: none; font-variant-numeric: tabular-nums; }
.ride .name { flex: 1; min-width: 0; font-weight: 700; font-size: 16px; line-height: 1.2; }
.ride.on .name { text-decoration: line-through; text-decoration-thickness: 2px; opacity: 0.6; }
.locate { width: 44px; height: 44px; flex: none; display: grid; place-items: center; border-radius: 10px; margin-right: -8px; }
.locate:active { background: rgba(21, 18, 13, 0.14); }

nav.bottom { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px 14px calc(8px + var(--safe-b)); border-top: 2px solid rgba(255, 255, 255, 0.22); z-index: 30; }
body[data-view="park"] nav.bottom { display: none; }
nav.bottom button { min-height: 50px; display: flex; align-items: center; justify-content: center; gap: 9px; border-radius: 10px; font-weight: 700; font-size: 15px; opacity: 0.75; }
nav.bottom button.on { background: var(--yellow); color: var(--ink); opacity: 1; }

.map-controls { position: absolute; z-index: 500; top: 12px; left: 12px; right: 12px; display: none; gap: 8px; pointer-events: none; }
body[data-view="park"] .map-controls { display: flex; }
.map-controls > * { pointer-events: auto; }
.mc-round { width: 44px; height: 44px; display: grid; place-items: center; background: #fff; color: var(--ink); border: 2px solid var(--ink); border-radius: 10px; }
.map-regions { position: absolute; z-index: 500; top: 12px; left: 12px; right: 12px; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; pointer-events: none; padding-bottom: 6px; }
.map-regions::-webkit-scrollbar { display: none; }
.map-regions .chip { pointer-events: auto; background: #fff; color: var(--ink); border-color: var(--ink); }
.map-regions .chip.on { background: var(--ink); color: #fff; }
body[data-view="park"] .map-regions { display: none; }

.leaflet-bar { border: 2px solid var(--ink) !important; border-radius: 10px !important; overflow: hidden; box-shadow: none !important; }
.leaflet-bar a { width: 40px !important; height: 40px !important; line-height: 38px !important; color: var(--ink) !important; font-weight: 700; }
.zlabel { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: var(--lab, 18px); line-height: 1; letter-spacing: -0.005em; color: var(--ink); }
.plan-note { position: absolute; z-index: 500; left: 12px; bottom: 12px; display: none; background: #fff; color: var(--ink); border: 2px solid var(--ink); border-radius: 8px; padding: 5px 10px; font-size: 12px; font-weight: 700; }
body[data-view="park"] .plan-note { display: block; }
.wpin.cl { background: var(--ink); color: var(--yellow); border-color: #fff; }
.wpin.cl b { background: #fff; color: var(--ink); }
.plist { min-width: 210px; }
.plist small { display: block; font-size: 12px; font-weight: 600; opacity: 0.7; margin-bottom: 6px; }
.plist button { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 46px; padding: 0 2px; text-align: left; border-top: 2px dashed rgba(21, 18, 13, 0.25); }
.plist button:first-of-type { border-top: 0; }
.plist i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--ink); flex: none; }
.plist span { flex: 1; font-weight: 700; font-size: 14px; }
.plist em { font-style: normal; font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 16px; }

.wpin { position: relative; min-width: 42px; height: 40px; padding: 0 8px; display: grid; place-items: center; background: var(--c); color: var(--ink); border: 2.5px solid var(--ink); border-radius: 10px; font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 17px; transition: transform 0.2s; }
.wpin:hover { transform: scale(1.1); }
.wpin b { position: absolute; right: -11px; top: -12px; background: var(--ink); color: var(--c); font-size: 11px; font-weight: 800; padding: 1px 6px; border-radius: 99px; font-stretch: 100%; font-family: 'DM Sans', sans-serif; }
.wpin .lbl { display: none; position: absolute; left: 50%; top: 46px; transform: translateX(-50%); white-space: nowrap; background: #fff; color: var(--ink); padding: 4px 10px; border: 2px solid var(--ink); border-radius: 8px; font-family: 'DM Sans', sans-serif; font-stretch: 100%; font-size: 12px; font-weight: 700; }
#map.zoomed .wpin .lbl { display: block; }
.rpin { position: absolute; left: 50%; top: 50%; translate: -50% -50%; width: var(--pin, 32px); height: var(--pin, 32px); display: grid; place-items: center; background: var(--c); color: var(--ink); border: 2.5px solid var(--ink); border-radius: 50%; font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: calc(var(--pin, 32px) * 0.5); transition: transform 0.2s; }
.rpin:hover { transform: scale(1.15); }
.rpin.on { background: var(--ink); color: var(--c); }
.rpin .ic { width: 55%; height: 55%; stroke-width: 3.6; }
.rpin.pulse { animation: pulse 0.9s ease-out 2; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(34, 48, 232, 0.8); } 100% { box-shadow: 0 0 0 22px rgba(34, 48, 232, 0); } }

.leaflet-popup-content-wrapper { border-radius: 12px; padding: 0; background: #fff; color: var(--ink); box-shadow: 0 10px 28px rgba(21, 18, 13, 0.3); }
.leaflet-popup-content { margin: 14px 16px; font-family: 'DM Sans', sans-serif; font-weight: 600; }
.leaflet-container { font-family: 'DM Sans', sans-serif; }
.pop { min-width: 190px; padding-top: 2px; line-height: 1.3; }
.pop small { display: block; font-size: 12px; font-weight: 600; opacity: 0.7; }
.pop strong { display: block; margin: 3px 0 12px; font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 21px; line-height: 0.98; }
.pop button { width: 100%; min-height: 44px; border-radius: 10px; background: var(--ink); color: #fff; font-weight: 700; font-size: 14px; }
.pop button.undo { background: #fff; color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }

.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 9999; overflow: hidden; }
.confetti span { position: absolute; top: -20px; width: 11px; height: 11px; border-radius: 50%; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh); } }
.toast { position: fixed; left: 50%; bottom: calc(24px + var(--safe-b)); transform: translateX(-50%) translateY(16px); background: #fff; color: var(--ink); padding: 13px 20px; border-radius: 10px; font-weight: 700; font-size: 15px; z-index: 9998; opacity: 0; transition: all 0.3s; pointer-events: none; white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis; }
body[data-view="home"] .toast { bottom: calc(86px + var(--safe-b)); }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body data-view="home" data-tab="list" data-expanded="0">

<div id="app">
  <section id="panel">
    <div id="home">
      <div class="scroll">
        <h1 class="wordmark">Coaster<br>to Coaster</h1>
        <p class="lede">Every park I've been to. Open a ticket to see its map and punch the rides.</p>
        <section class="punch" id="card"></section>
        <div class="controls">
          <div class="seg">
            <button id="cat-core" class="on">Theme parks</button>
            <button id="cat-all">Plus bonus stops</button>
          </div>
          <div class="chips" id="chips"></div>
        </div>
        <div class="park-list" id="park-list"></div>
      </div>
    </div>

    <div id="detail">
      <div class="d-head">
        <div class="d-top">
          <button class="back" id="back-btn" aria-label="Back to all parks"><span class="ico" data-i="back"></span></button>
          <div class="d-title">
            <h2 id="d-name"></h2>
            <p id="d-city"></p>
          </div>
        </div>
        <div class="d-meta">
          <b id="d-count"></b>
          <div class="d-actions">
            <a class="btn" id="d-official" target="_blank" rel="noopener noreferrer"><span class="ico" data-i="map"></span>Park map</a>
            <button class="btn solid" id="d-all"></button>
          </div>
        </div>
        <div class="holes" id="d-holes"></div>
      </div>
      <div class="d-list scroll" id="d-list"></div>
    </div>
  </section>

  <section id="mapwrap">
    <div id="map"></div>
    <div id="plan"></div>
    <div class="map-controls">
      <button class="mc-round expand-btn" id="expand-btn" aria-label="Resize map"></button>
    </div>
    <div class="map-regions" id="map-regions"></div>
    <div class="plan-note">Schematic plan, not to scale</div>
  </section>
</div>

<nav class="bottom">
  <button id="tab-list" class="on"><span class="ico" data-i="ticket"></span>Tickets</button>
  <button id="tab-map"><span class="ico" data-i="globe"></span>World map</button>
</nav>

<div class="toast" id="toast"></div>

  return ((words[0][0] + (words[1] ? words[1][0] : words[0][1])) || "").toUpperCase();
}

const world = L.map("map", { zoomControl: false, attributionControl: false, minZoom: 1, maxZoom: 7, zoomSnap: 0.25, maxBounds: [[-62, -200], [88, 200]], maxBoundsViscosity: 0.8 }).setView([25, 40], 2);
L.control.zoom({ position: "bottomright" }).addTo(world);
L.geoJSON(WORLD, { interactive: false, style: { fillColor: "#ffffff", fillOpacity: 1, color: "#c4ccff", weight: 0.8 } }).addTo(world);

const plan = L.map("plan", { crs: L.CRS.Simple, zoomControl: false, attributionControl: false, minZoom: -3, maxZoom: 2.5, zoomSnap: 0.1, zoomDelta: 0.5, wheelPxPerZoomLevel: 90 }).setView([0, 0], 0);
L.control.zoom({ position: "bottomright" }).addTo(plan);

const worldLayer = L.layerGroup().addTo(world);
const planLayer = L.layerGroup().addTo(plan);
let ridePins = {};
let ridePos = {};
let planBounds = null;
const INK = "#15120d";

function activeMap() { return body.dataset.view === "park" ? plan : world; }
function refreshMap() { [60, 400].forEach(t => setTimeout(() => activeMap().invalidateSize(), t)); }
function sized(m) { m.invalidateSize(); const s = m.getSize(); return s.x > 0 && s.y > 0; }

function fitWorld(pts, maxZoom) {
  if (!pts.length || !sized(world)) return;
  if (pts.length === 1) world.flyTo(pts[0], Math.min(maxZoom, 6), { duration: 0.9 });
  else world.flyToBounds(L.latLngBounds(pts), { padding: [70, 70], maxZoom, duration: 1 });
}
function fitVisible() { fitWorld(visibleParks().map(p => p.coords), 4); }

function fitPlan() {
  if (!planBounds || !sized(plan)) return;
  const z = Math.max(plan.getBoundsZoom(planBounds, false, L.point(16, 16)), -1.6);
  plan.setView(planBounds.getCenter(), Math.min(z, 1), { animate: false });
  scalePlan();
}

function scalePlan() {
  const s = Math.pow(2, plan.getZoom());
  const el = $("plan");
  el.style.setProperty("--pin", Math.max(22, Math.min(32, 40 * s * 0.8)) + "px");
  el.style.setProperty("--lab", Math.max(11, Math.min(18, 26 * s)) + "px");
}

function layoutPark(p) {
  const lands = [...new Set(p.rides.map(r => r.land))];
  const GAP = 40;
  const zones = lands.map(land => {
    const rides = p.rides.filter(r => r.land === land);
    const n = rides.length;
    const rho = n === 1 ? 0 : Math.max(24, GAP * n / (2 * Math.PI));
    return { land, rides, rho, R: rho + 30 };
  });
  const k = zones.length;
  if (k === 1) {
    zones[0].cx = 0; zones[0].cy = 0; zones[0].dir = [0, 1];
  } else {
    const total = zones.reduce((s, z) => s + 2 * z.R + 12, 0);
    const maxR = Math.max(...zones.map(z => z.R));
    const ring = Math.max(total / (2 * Math.PI) * 1.05, maxR + 50);
    let acc = 0;
    zones.forEach(z => {
      const arc = (2 * z.R + 12) / ring;
      const phi = Math.PI / 2 - (acc + arc / 2);
      acc += arc;
      z.dir = [Math.cos(phi), Math.sin(phi)];
      z.cx = ring * z.dir[0];
      z.cy = ring * z.dir[1];
    });
  }
  zones.forEach(z => {
    const n = z.rides.length;
    z.pins = z.rides.map((r, i) => {
      const th = Math.PI / 2 - (2 * Math.PI * i) / n;
      return { r, x: z.cx + z.rho * Math.cos(th), y: z.cy + z.rho * Math.sin(th) };
    });
    z.hw = z.land.length * 4.4;
    z.lx = z.cx + z.dir[0] * (z.R + 14) + Math.sign(z.dir[0]) * z.hw * Math.abs(z.dir[0]);
    z.ly = z.cy + z.dir[1] * (z.R + 14);
  });
  return zones;
}

function renderPlan() {
  planLayer.clearLayers();
  ridePins = {};
  ridePos = {};
  const p = PARKS.find(x => x.id === activePark);
  if (!p) return;
  const zones = layoutPark(p);
  const multi = zones.length > 1;
  let minX = 0, maxX = 0, minY = 0, maxY = 0;
  zones.forEach(z => {
    minX = Math.min(minX, z.cx - z.R - 12, z.lx - z.hw - 8); maxX = Math.max(maxX, z.cx + z.R + 12, z.lx + z.hw + 8);
    minY = Math.min(minY, z.cy - z.R - 12, z.ly - 14); maxY = Math.max(maxY, z.cy + z.R + 12, z.ly + 14);
  });
  planBounds = L.latLngBounds([minY, minX], [maxY, maxX]);

  if (multi) {
    zones.forEach(z => L.polyline([[0, 0], [z.cy, z.cx]], { color: INK, weight: 2, opacity: 0.3, dashArray: "2 8", lineCap: "round", interactive: false }).addTo(planLayer));
    L.circleMarker([0, 0], { radius: 7, color: INK, fillColor: INK, fillOpacity: 1, weight: 0, interactive: false }).addTo(planLayer);
  }
  zones.forEach(z => {
    L.circle([z.cy, z.cx], { radius: z.R, fillColor: "#ffffff", fillOpacity: 0.84, color: INK, weight: 2, dashArray: "1 7", lineCap: "round", interactive: false }).addTo(planLayer);
    L.marker([z.ly, z.lx], { icon: L.divIcon({ className: "", iconSize: [0, 0], html: `<span class="zlabel">${z.land}</span>` }), interactive: false, keyboard: false }).addTo(planLayer);
  });
  zones.forEach(z => z.pins.forEach(pin => {
    const r = pin.r;
    const idx = p.rides.indexOf(r);
    const on = !!ridden[r.id];
    ridePos[r.id] = [pin.y, pin.x];
    const icon = L.divIcon({
      html: `<div class="rpin ${on ? "on" : ""}" style="--c:${p.color}" id="pin-${r.id}">${on ? ICON("check") : idx + 1}</div>`,
      className: "", iconSize: [32, 32], iconAnchor: [16, 16]
    });
    const m = L.marker([pin.y, pin.x], { icon, keyboard: false }).addTo(planLayer);
    m.bindPopup(() => `
      <div class="pop">
        <small>${r.land}</small>
        <strong>${r.name}</strong>
        <button class="${ridden[r.id] ? "undo" : ""}" data-popup-toggle="${r.id}">${ridden[r.id] ? "Undo punch" : "Punch this ride"}</button>
      </div>`, { closeButton: false, offset: [0, -6], autoPanPaddingTopLeft: [16, 70], autoPanPaddingBottomRight: [16, 24] });
    ridePins[r.id] = m;
  }));
}

function renderStats() {
  const all = PARKS.flatMap(p => p.rides);
  const done = all.filter(r => ridden[r.id]).length;
  const finished = PARKS.filter(p => parkCount(p) === p.rides.length).length;
  $("card").innerHTML = `
    <div class="punch-top"><b>${done}</b><span>of ${all.length} rides<br>punched</span></div>
    <p class="punch-sub">${finished ? finished + " of " + PARKS.length + " places fully punched." : "Nothing punched yet. Open a ticket and tick your first ride."}</p>
    <div class="perf"></div>
    <div class="holes">${holesHTML(all)}</div>`;
}

function renderChips() {
  $("chips").innerHTML = REGIONS.map(r => `<button class="chip ${r.id === regionFilter ? "on" : ""}" data-region="${r.id}">${r.label}</button>`).join("");
}

function renderMapRegions() {
  $("map-regions").innerHTML = REGIONS.map(r => `<button class="chip" data-mregion="${r.id}">${r.label}</button>`).join("");
}

function renderList() {
  const list = $("park-list");
  const parks = visibleParks();
  if (!parks.length) {
    list.innerHTML = `<div class="empty">No parks in this region yet. Pick another one above.</div>`;
    return;
  }
  list.innerHTML = parks.map(p => {
    const n = parkCount(p);
    const total = p.rides.length;
    const full = n === total;
    return `
      <button class="ticket${full ? " done" : ""}" data-park="${p.id}" style="--s:${p.color}">
        <span class="t-main">
          <span>
            <span class="t-city">${p.city}</span>
            <span class="t-name">${p.name}</span>
          </span>
          <span class="holes sm">${holesHTML(p.rides)}</span>
        </span>
        <span class="t-stub">${full ? ICON("check") : "<b>" + n + "</b>"}<i>${full ? "all punched" : "of " + total}</i></span>
      </button>`;
  }).join("");
}

function clusterParks() {
  const thr = 44 * 360 / (256 * Math.pow(2, world.getZoom()));
  const out = [];
  visibleParks().forEach(p => {
    const c = out.find(o => Math.abs(o.lat - p.coords[0]) < thr && Math.abs(o.lng - p.coords[1]) < thr);
    if (c) c.parks.push(p); else out.push({ lat: p.coords[0], lng: p.coords[1], parks: [p] });
  });
  return out;
}

function renderWorldPins() {
  worldLayer.clearLayers();
  clusterParks().forEach(c => {
    if (c.parks.length === 1) {
      const p = c.parks[0];
      const html = `<div class="wpin" style="--c:${p.color}">${mono(p)}<b>${parkCount(p)}/${p.rides.length}</b><span class="lbl">${p.short}</span></div>`;
      const icon = L.divIcon({ html, className: "", iconSize: [42, 40], iconAnchor: [21, 20] });
      L.marker([c.lat, c.lng], { icon }).addTo(worldLayer).on("click", () => openPark(p.id));
      return;
    }
    const total = c.parks.reduce((s, p) => s + p.rides.length, 0);
    const done = c.parks.reduce((s, p) => s + parkCount(p), 0);
    const icon = L.divIcon({ html: `<div class="wpin cl">${c.parks.length}<b>${done}/${total}</b></div>`, className: "", iconSize: [42, 40], iconAnchor: [21, 20] });
    L.marker([c.lat, c.lng], { icon }).addTo(worldLayer).on("click", () => {
      const list = c.parks.map(p => `<button data-open-park="${p.id}"><i style="background:${p.color}"></i><span>${p.short}</span><em>${parkCount(p)}/${p.rides.length}</em></button>`).join("");
      L.popup({ closeButton: false, offset: [0, -14] }).setLatLng([c.lat, c.lng]).setContent(`<div class="plist"><small>${c.parks.length} parks here</small>${list}</div>`).openOn(world);
    });
  });
}

function openPark(id) {
  const p = PARKS.find(x => x.id === id);
  if (!p) return;
  activePark = p.id;
  body.dataset.view = "park";
  body.dataset.expanded = "0";
  $("expand-btn").innerHTML = ICON("expand");
  document.documentElement.style.setProperty("--pc", p.color);
  $("d-name").textContent = p.name;
  $("d-city").textContent = p.city;
  $("d-official").href = p.official;
  renderDetail();
  renderPlan();
  $("d-list").scrollTop = 0;
  refreshMap();
  setTimeout(fitPlan, 220);
}

function closePark() {
  activePark = null;
  body.dataset.view = "home";
  body.dataset.expanded = "0";
  planLayer.clearLayers();
  ridePins = {};
  renderAll();
  refreshMap();
  setTimeout(fitVisible, 220);
}

function renderDetail() {
  const p = PARKS.find(x => x.id === activePark);
  if (!p) return;
  const n = parkCount(p);
  $("d-count").textContent = n + " of " + p.rides.length + " punched";
  $("d-holes").innerHTML = holesHTML(p.rides);
  $("d-all").innerHTML = n === p.rides.length ? ICON("undo") + "Clear all" : ICON("checks") + "Punch all";

  const groups = {};
  p.rides.forEach((r, i) => { (groups[r.land] = groups[r.land] || []).push({ ...r, num: i + 1 }); });

  $("d-list").innerHTML = Object.entries(groups).map(([land, rides]) => `
    <div class="group">
      <h3 class="land">${land}</h3>
      ${rides.map(r => `
        <div class="ride${ridden[r.id] ? " on" : ""}${r.id === fresh ? " fresh" : ""}" data-ride="${r.id}" role="checkbox" aria-checked="${!!ridden[r.id]}" tabindex="0">
          <span class="hole">${ICON("check")}</span>
          <span class="num">${r.num}</span>
          <span class="name">${r.name}</span>
          <button class="locate" data-locate="${r.id}" aria-label="Show ${r.name} on the map">${ICON("pin")}</button>
        </div>`).join("")}
    </div>`).join("");
}

function toggleRide(id) {
  const p = PARKS.find(x => x.id === activePark);
  const wasFull = p && parkCount(p) === p.rides.length;
  ridden[id] = !ridden[id];
  fresh = ridden[id] ? id : null;
  save();
  renderStats();
  if (p) {
    renderDetail();
    renderPlan();
    if (!wasFull && parkCount(p) === p.rides.length) celebrate(p);
  }
  fresh = null;
}

function toggleAll() {
  const p = PARKS.find(x => x.id === activePark);
  if (!p) return;
  const all = parkCount(p) === p.rides.length;
  p.rides.forEach(r => { ridden[r.id] = !all; });
  save();
  renderStats();
  renderDetail();
  renderPlan();
  if (!all) celebrate(p);
}

function locateRide(id) {
  if (!ridePos[id]) return;
  body.dataset.expanded = "0";
  refreshMap();
  setTimeout(() => {
    if (!sized(plan)) return;
    plan.flyTo(ridePos[id], Math.max(plan.getZoom(), 0.8), { duration: 0.8 });
    setTimeout(() => {
      const m = ridePins[id];
      if (m) m.openPopup();
      const el = $("pin-" + id);
      if (el) el.classList.add("pulse");
    }, 900);
  }, 200);
}

function celebrate(p) {
  const box = document.createElement("div");
  box.className = "confetti";
  for (let i = 0; i < 46; i++) {
    const s = document.createElement("span");
    s.style.background = STOCKS[i % STOCKS.length];
    s.style.left = Math.random() * 100 + "vw";
    s.style.animationDuration = 1.8 + Math.random() * 1.6 + "s";
    s.style.animationDelay = Math.random() * 0.5 + "s";
    box.appendChild(s);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 4000);
  toast("Ticket complete: " + p.short);
}

let toastTimer;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

function setCat(c) {
  catFilter = c;
  $("cat-core").classList.toggle("on", c === "core");
  $("cat-all").classList.toggle("on", c === "all");
  renderAll();
  fitVisible();
}

function setRegion(r) {
  regionFilter = r;
  renderAll();
  fitVisible();
}

function setTab(t) {
  body.dataset.tab = t;
  $("tab-list").classList.toggle("on", t === "list");
  $("tab-map").classList.toggle("on", t === "map");
  if (t === "map") { refreshMap(); setTimeout(fitVisible, 200); }
}

function renderAll() {
  renderStats();
  renderChips();
  renderMapRegions();
  renderList();
  renderWorldPins();
}

$("park-list").addEventListener("click", e => {
  const c = e.target.closest("[data-park]");
  if (c) openPark(c.dataset.park);
});
$("chips").addEventListener("click", e => {
  const c = e.target.closest("[data-region]");
  if (c) setRegion(c.dataset.region);
});
$("map-regions").addEventListener("click", e => {
  const c = e.target.closest("[data-mregion]");
  if (!c) return;
  const r = c.dataset.mregion;
  if (r === "ALL") { fitVisible(); return; }
  fitWorld(PARKS.filter(p => p.region === r && (catFilter === "all" || p.cat === "core")).map(p => p.coords), 6);
});
$("d-list").addEventListener("click", e => {
  const loc = e.target.closest("[data-locate]");
  if (loc) { e.stopPropagation(); locateRide(loc.dataset.locate); return; }
  const row = e.target.closest("[data-ride]");
  if (row) toggleRide(row.dataset.ride);
});
$("d-list").addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const row = e.target.closest("[data-ride]");
  if (row && e.target === row) { e.preventDefault(); toggleRide(row.dataset.ride); }
});
function bindPopup(e) {
  const el = e.popup.getElement();
  const btn = el.querySelector("[data-popup-toggle]");
  if (btn) btn.addEventListener("click", () => { toggleRide(btn.dataset.popupToggle); plan.closePopup(); });
  el.querySelectorAll("[data-open-park]").forEach(b => b.addEventListener("click", () => { world.closePopup(); openPark(b.dataset.openPark); }));
}
plan.on("zoom", scalePlan);
world.on("popupopen", bindPopup);
plan.on("popupopen", bindPopup);
world.on("zoomend", () => { $("map").classList.toggle("zoomed", world.getZoom() >= 5); renderWorldPins(); });
$("cat-core").addEventListener("click", () => setCat("core"));
$("cat-all").addEventListener("click", () => setCat("all"));
$("back-btn").addEventListener("click", closePark);
$("d-all").addEventListener("click", toggleAll);
$("tab-list").addEventListener("click", () => setTab("list"));
$("tab-map").addEventListener("click", () => setTab("map"));
$("expand-btn").addEventListener("click", () => {
  const on = body.dataset.expanded === "1";
  body.dataset.expanded = on ? "0" : "1";
  $("expand-btn").innerHTML = ICON(on ? "expand" : "shrink");
  refreshMap();
  setTimeout(fitPlan, 450);
});
window.addEventListener("resize", () => activeMap().invalidateSize());

$("expand-btn").innerHTML = ICON("expand");
renderAll();
setTimeout(fitVisible, 200);
</script>
</body>
</html>
