<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <!-- Google Fonts: Geist & Geist Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Geist"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['"Geist Mono"', 'monospace'],
          },
          colors: {
            accent: {
              400: '#fb7185',
              500: '#f43f5e',
              600: '#e11d48',
            }
          }
        }
      }
    };
  </script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
      letter-spacing: -0.01em;
    }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    #map { height: 100%; width: 100%; z-index: 10; background: #f4f4f5; }
    .dark #map { background: #09090b; }

    /* Minimal Scrollbars */
    .clean-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
    .clean-scroll::-webkit-scrollbar-track { background: transparent; }
    .clean-scroll::-webkit-scrollbar-thumb { background: rgba(161, 161, 170, 0.25); border-radius: 9999px; }
    .clean-scroll::-webkit-scrollbar-thumb:hover { background: rgba(161, 161, 170, 0.45); }

    /* Leaflet Popup Styling */
    .leaflet-popup-content-wrapper {
      background: rgba(9, 9, 11, 0.94);
      backdrop-filter: blur(12px);
      color: #fafafa;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      box-shadow: 0 16px 32px -8px rgba(0, 0, 0, 0.5);
      padding: 0;
    }
    .leaflet-popup-tip { background: rgba(9, 9, 11, 0.94); }
    .leaflet-popup-content { margin: 12px 14px; font-family: 'Geist', sans-serif; }
    .leaflet-container a.leaflet-popup-close-button {
      color: #71717a;
      padding: 8px 8px 0 0;
    }
    .leaflet-container a.leaflet-popup-close-button:hover { color: #fafafa; }
  </style>
</head>

<body class="h-[100dvh] w-screen overflow-hidden flex flex-col bg-zinc-50 text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100 select-none antialiased">

  <!-- Minimal Typographic Header -->
  <header class="h-14 shrink-0 bg-white/85 dark:bg-zinc-950/85 backdrop-blur-md border-b border-zinc-200/80 dark:border-zinc-800/80 px-4 lg:px-6 flex items-center justify-between gap-4 z-30">
    <!-- Pure Wordmark (No App Icon Box) -->
    <button onclick="resetWorldView()" class="text-left focus:outline-none group flex items-baseline gap-2.5">
      <span class="text-[15px] font-semibold tracking-[-0.025em] text-zinc-900 dark:text-zinc-100 group-hover:text-accent-600 dark:group-hover:text-accent-400 transition-colors">
        Coaster to Coaster
      </span>
      <span id="header-context" class="hidden sm:inline font-mono text-[11px] text-zinc-400 dark:text-zinc-500">
        World Index
      </span>
    </button>

    <!-- Center Segmented Filter (Desktop) -->
    <div class="hidden md:flex items-center bg-zinc-100 dark:bg-zinc-900 p-0.5 rounded-lg border border-zinc-200/70 dark:border-zinc-800 text-xs">
      <button onclick="setCategoryFilter('core')" id="btn-cat-core" class="px-3 py-1 rounded-md font-medium transition-all bg-white dark:bg-zinc-800 text-zinc-900 dark:text-zinc-100 shadow-sm">
        Core Parks <span class="font-mono text-[11px] text-zinc-400 ml-1">11</span>
      </button>
      <button onclick="setCategoryFilter('all')" id="btn-cat-all" class="px-3 py-1 rounded-md font-medium text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-200 transition-all">
        Extended <span class="font-mono text-[11px] text-zinc-400 ml-1">16</span>
      </button>
    </div>

    <!-- Right Telemetry & Actions -->
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-3 font-mono text-xs tabular-nums bg-zinc-100/80 dark:bg-zinc-900/80 px-3 py-1.5 rounded-lg border border-zinc-200/60 dark:border-zinc-800/80">
        <span class="text-zinc-500 dark:text-zinc-400">Logged</span>
        <span id="stat-rides" class="font-semibold text-zinc-900 dark:text-zinc-100">0 / 0</span>
      </div>

      <button onclick="resetWorldView()" id="world-reset-btn" title="World Overview" class="hidden items-center gap-1.5 px-2.5 py-1.5 rounded-lg bg-zinc-100 hover:bg-zinc-200/80 dark:bg-zinc-900 dark:hover:bg-zinc-800 border border-zinc-200/70 dark:border-zinc-800 text-xs font-medium text-zinc-700 dark:text-zinc-300 transition">
        <i class="ph ph-globe-simple text-sm"></i>
        <span class="hidden sm:inline">World Map</span>
      </button>

      <button onclick="toggleTheme()" title="Toggle Theme" class="w-8 h-8 rounded-lg hover:bg-zinc-100 dark:hover:bg-zinc-900 flex items-center justify-center text-zinc-500 hover:text-zinc-900 dark:text-zinc-400 dark:hover:text-zinc-100 transition">
        <i id="theme-icon" class="ph ph-sun text-base"></i>
      </button>
    </div>
  </header>

  <!-- Main Split Workspace -->
  <div class="flex-1 flex overflow-hidden relative">

    <!-- Left Sidebar: Directory & Active Park Checklist -->
    <aside id="left-drawer" class="w-full lg:w-[390px] xl:w-[410px] shrink-0 bg-white dark:bg-zinc-950 border-r border-zinc-200/80 dark:border-zinc-800/80 flex flex-col z-20">

      <!-- STATE 1: Global Park Directory -->
      <div id="view-directory" class="flex-1 flex flex-col overflow-hidden">
        <!-- Mobile Category Toggle -->
        <div class="md:hidden px-4 pt-3 flex items-center gap-1.5">
          <button onclick="setCategoryFilter('core')" id="m-btn-cat-core" class="flex-1 py-1.5 rounded-lg text-xs font-medium bg-zinc-900 text-white dark:bg-zinc-100 dark:text-zinc-900">
            Core Parks (11)
          </button>
          <button onclick="setCategoryFilter('all')" id="m-btn-cat-all" class="flex-1 py-1.5 rounded-lg text-xs font-medium bg-zinc-100 dark:bg-zinc-900 text-zinc-500 dark:text-zinc-400">
            Extended (16)
          </button>
        </div>

        <!-- Search & Region Bar -->
        <div class="p-3.5 border-b border-zinc-200/70 dark:border-zinc-800/80 space-y-2.5">
          <div class="relative">
            <i class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-zinc-400 text-sm"></i>
            <input type="text" id="park-search" oninput="renderParkDirectory()" placeholder="Filter parks, cities, or rides..."
              class="w-full bg-zinc-100/80 dark:bg-zinc-900/90 border border-zinc-200/70 dark:border-zinc-800 rounded-lg pl-8 pr-7 py-1.5 text-xs text-zinc-900 dark:text-zinc-100 placeholder-zinc-400 focus:outline-none focus:border-zinc-400 dark:focus:border-zinc-600 transition" />
            <button id="clear-search-btn" onclick="clearSearch()" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-200">
              <i class="ph ph-x text-xs"></i>
            </button>
          </div>

          <!-- Region Pills -->
          <div class="flex items-center gap-1 overflow-x-auto clean-scroll text-[11px] font-medium">
            <button onclick="setRegionFilter('ALL')" data-region="ALL" class="region-pill shrink-0 px-2.5 py-1 rounded-md bg-zinc-900 text-white dark:bg-zinc-100 dark:text-zinc-900 transition">
              All
            </button>
            <button onclick="setRegionFilter('UAE')" data-region="UAE" class="region-pill shrink-0 px-2.5 py-1 rounded-md text-zinc-500 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-zinc-900 transition">
              UAE
            </button>
            <button onclick="setRegionFilter('ASIA')" data-region="ASIA" class="region-pill shrink-0 px-2.5 py-1 rounded-md text-zinc-500 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-zinc-900 transition">
              Asia
            </button>
            <button onclick="setRegionFilter('NA')" data-region="NA" class="region-pill shrink-0 px-2.5 py-1 rounded-md text-zinc-500 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-zinc-900 transition">
              Canada
            </button>
            <button onclick="setRegionFilter('UK')" data-region="UK" class="region-pill shrink-0 px-2.5 py-1 rounded-md text-zinc-500 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-zinc-900 transition">
              UK
            </button>
          </div>
        </div>

        <!-- Park List -->
        <div id="park-list" class="flex-1 overflow-y-auto clean-scroll divide-y divide-zinc-100 dark:divide-zinc-900"></div>
      </div>

      <!-- STATE 2: Active Park Ride Tracker -->
      <div id="view-park-detail" class="hidden flex-1 flex flex-col overflow-hidden">
        <!-- Clean Park Header -->
        <div class="p-4 border-b border-zinc-200/80 dark:border-zinc-800/80 space-y-3">
          <div class="flex items-center justify-between">
            <button onclick="resetWorldView()" class="inline-flex items-center gap-1.5 text-xs font-medium text-zinc-500 hover:text-zinc-900 dark:text-zinc-400 dark:hover:text-zinc-100 transition">
              <i class="ph ph-arrow-left text-sm"></i>
              <span>All Parks</span>
            </button>

            <a id="detail-official-map-link" href="#" target="_blank" rel="noopener noreferrer"
              class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-accent-600 hover:bg-accent-500 text-white text-xs font-medium transition">
              <i class="ph ph-map-trifold text-sm"></i>
              <span>Official Park Map</span>
              <i class="ph ph-arrow-up-right text-[11px]"></i>
            </a>
          </div>

          <div>
            <h2 id="detail-title" class="text-base font-semibold tracking-[-0.02em] text-zinc-900 dark:text-zinc-100"></h2>
            <p id="detail-location" class="text-xs text-zinc-500 dark:text-zinc-400 mt-0.5"></p>
          </div>

          <!-- Progress Bar & Quick Toggle -->
          <div class="pt-1">
            <div class="flex items-center justify-between text-xs mb-1.5">
              <span id="detail-progress-text" class="font-mono text-[11px] font-medium text-zinc-600 dark:text-zinc-300 tabular-nums">0 / 0 ridden</span>
              <button onclick="toggleAllParkRides()" class="text-[11px] font-medium text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 transition">
                Toggle All
              </button>
            </div>
            <div class="w-full h-1.5 bg-zinc-100 dark:bg-zinc-900 rounded-full overflow-hidden">
              <div id="detail-progress-bar" class="h-full bg-accent-600 transition-all duration-300" style="width: 0%"></div>
            </div>
          </div>
        </div>

        <!-- Filter Bar -->
        <div class="px-4 py-2 bg-zinc-50/60 dark:bg-zinc-900/40 border-b border-zinc-200/70 dark:border-zinc-800/80 flex items-center justify-between">
          <div class="flex items-center gap-1 text-[11px] font-medium">
            <button onclick="setRideStatusFilter('all')" id="rf-all" class="px-2 py-0.5 rounded bg-zinc-900 text-white dark:bg-zinc-100 dark:text-zinc-900 transition">
              All
            </button>
            <button onclick="setRideStatusFilter('ridden')" id="rf-ridden" class="px-2 py-0.5 rounded text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-200 transition">
              Ridden
            </button>
            <button onclick="setRideStatusFilter('unridden')" id="rf-unridden" class="px-2 py-0.5 rounded text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-200 transition">
              Remaining
            </button>
          </div>

          <button onclick="toggleAddRideDrawer()" class="text-[11px] font-medium text-zinc-500 hover:text-zinc-900 dark:text-zinc-400 dark:hover:text-zinc-100 flex items-center gap-1 transition">
            <i class="ph ph-plus text-xs"></i>
            <span>Custom Ride</span>
          </button>
        </div>

        <!-- Collapsible Custom Ride Popover (Hidden by Default to Avoid Clutter) -->
        <div id="custom-ride-drawer" class="hidden px-4 py-2.5 bg-zinc-100/70 dark:bg-zinc-900/80 border-b border-zinc-200/70 dark:border-zinc-800 flex gap-1.5">
          <input type="text" id="new-ride-name" placeholder="Ride name..."
            class="flex-1 min-w-0 bg-white dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 rounded-md px-2.5 py-1 text-xs text-zinc-900 dark:text-zinc-100 focus:outline-none focus:border-zinc-400" />
          <input type="text" id="new-ride-land" placeholder="Land/Zone"
            class="w-24 bg-white dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 rounded-md px-2 py-1 text-xs text-zinc-900 dark:text-zinc-100 focus:outline-none focus:border-zinc-400" />
          <button onclick="addCustomRide()" class="px-2.5 py-1 bg-zinc-900 dark:bg-zinc-100 text-white dark:text-zinc-900 rounded-md text-xs font-medium">
            Save
          </button>
        </div>

        <!-- Grouped Ride Checklist -->
        <div id="detail-rides-container" class="flex-1 overflow-y-auto clean-scroll p-4 space-y-5"></div>
      </div>
    </aside>

    <!-- Interactive Map Canvas -->
    <main id="map-workspace" class="hidden lg:block flex-1 relative h-full">
      <div id="map"></div>

      <!-- Minimal Map Mode Pill (Top Right) -->
      <div class="absolute top-3.5 right-3.5 z-20 flex items-center bg-white/90 dark:bg-zinc-950/90 backdrop-blur-md border border-zinc-200/80 dark:border-zinc-800 p-1 rounded-lg shadow-sm text-xs font-medium">
        <button onclick="switchBasemap('canvas')" id="base-canvas" class="px-2.5 py-1 rounded-md bg-zinc-900 text-white dark:bg-zinc-100 dark:text-zinc-900 transition">
          Atlas
        </button>
        <button onclick="switchBasemap('park')" id="base-park" class="px-2.5 py-1 rounded-md text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-200 transition">
          Park Layout
        </button>
        <button onclick="switchBasemap('satellite')" id="base-satellite" class="px-2.5 py-1 rounded-md text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-200 transition">
          Satellite
        </button>
      </div>
    </main>
  </div>

  <nav class="lg:hidden h-13 shrink-0 bg-white/95 dark:bg-zinc-950/95 backdrop-blur-md border-t border-zinc-200/80 dark:border-zinc-800/80 grid grid-cols-2 px-4 py-1.5 z-30">
    <button onclick="switchMobileTab('list')" id="mob-tab-list" class="flex items-center justify-center gap-2 py-1.5 rounded-lg text-xs font-medium bg-zinc-100 dark:bg-zinc-900 text-zinc-900 dark:text-zinc-100">
      <i class="ph ph-list-checks text-base"></i>
      <span>Parks & Rides</span>

    <button onclick="switchMobileTab('map')" id="mob-tab-map" class="flex items-center justify-center gap-2 py-1.5 rounded-lg text-xs font-medium text-zinc-500 dark:text-zinc-400">
      <i class="ph ph-map-trifold text-base"></i>
      <span>Interactive Map</span>
    </button>
  </nav>

    // Persistent State
    let riddenRides = JSON.parse(localStorage.getItem("ctc_ridden_rides") || "{}");
    let customRides = JSON.parse(localStorage.getItem("ctc_custom_rides") || "{}");
    let currentCategoryFilter = "core";
    let currentRegionFilter = "ALL";
    let currentRideStatusFilter = "all";
    let activeParkId = null;
    let currentBasemapMode = "canvas";

    // Initialize Leaflet with Key-Free Esri ArcGIS Public REST MapServer Tiles
    const map = L.map("map", { zoomControl: false, attributionControl: false }).setView([25, 45], 3);
    L.control.zoom({ position: "bottomright" }).addTo(map);

    const tileLayers = {
      darkCanvas: L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}", { maxZoom: 16 }),
      lightCanvas: L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}", { maxZoom: 16 }),
      parkTopo: L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19 }),
      satellite: L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19 })
    };

    const parkMarkersGroup = L.layerGroup().addTo(map);
    const rideMarkersGroup = L.layerGroup().addTo(map);

    function isDarkMode() {
      return document.documentElement.classList.contains("dark");
    }

    function applyBasemapLayer() {
      Object.values(tileLayers).forEach(l => map.removeLayer(l));
      if (currentBasemapMode === "canvas") {
        (isDarkMode() ? tileLayers.darkCanvas : tileLayers.lightCanvas).addTo(map);
      } else if (currentBasemapMode === "park") {
        tileLayers.parkTopo.addTo(map);
      } else {
        tileLayers.satellite.addTo(map);
      }
    }

    function toggleTheme() {
      const html = document.documentElement;
      html.classList.toggle("dark");
      const dark = html.classList.contains("dark");
      localStorage.setItem("ctc_theme", dark ? "dark" : "light");
      document.getElementById("theme-icon").className = dark ? "ph ph-sun text-base" : "ph ph-moon text-base";
      applyBasemapLayer();
    }

    (function initTheme() {
      const saved = localStorage.getItem("ctc_theme");
      if (saved === "light") {
        document.documentElement.classList.remove("dark");
        document.getElementById("theme-icon").className = "ph ph-moon text-base";
      }
      applyBasemapLayer();
    })();

    function switchBasemap(mode) {
      currentBasemapMode = mode;
      applyBasemapLayer();
      ["canvas", "park", "satellite"].forEach(m => {
        const btn = document.getElementById(`base-${m}`);
        if (!btn) return;
        btn.className = m === mode
          ? "px-2.5 py-1 rounded-md bg-zinc-900 text-white dark:bg-zinc-100 dark:text-zinc-900 transition"
          : "px-2.5 py-1 rounded-md text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-200 transition";
      });
    }

    function getAllRidesForPark(park) {
      const extra = customRides[park.id] || [];
      return [...park.rides, ...extra];
    }

    function getVisibleParks() {
      return PARKS_DATA.filter(p => {
        const catMatch = currentCategoryFilter === "all" || p.category === "core";
        const regMatch = currentRegionFilter === "ALL" || p.region === currentRegionFilter;
        return catMatch && regMatch;
      });
    }

    function setCategoryFilter(filter) {
      currentCategoryFilter = filter;
      const activeD = "px-3 py-1 rounded-md font-medium transition-all bg-white dark:bg-zinc-800 text-zinc-900 dark:text-zinc-100 shadow-sm";
      const inactiveD = "px-3 py-1 rounded-md font-medium text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-200 transition-all";
      document.getElementById("btn-cat-core").className = filter === "core" ? activeD : inactiveD;
      document.getElementById("btn-cat-all").className = filter === "all" ? activeD : inactiveD;

      const activeM = "flex-1 py-1.5 rounded-lg text-xs font-medium bg-zinc-900 text-white dark:bg-zinc-100 dark:text-zinc-900";
      const inactiveM = "flex-1 py-1.5 rounded-lg text-xs font-medium bg-zinc-100 dark:bg-zinc-900 text-zinc-500 dark:text-zinc-400";
      document.getElementById("m-btn-cat-core").className = filter === "core" ? activeM : inactiveM;
      document.getElementById("m-btn-cat-all").className = filter === "all" ? activeM : inactiveM;

      renderParkDirectory();
      renderGlobalMarkers();
      updateGlobalStats();
    }

    function setRegionFilter(region) {
      currentRegionFilter = region;
      document.querySelectorAll(".region-pill").forEach(btn => {
        const isCurrent = btn.getAttribute("data-region") === region;
        btn.className = isCurrent
          ? "region-pill shrink-0 px-2.5 py-1 rounded-md bg-zinc-900 text-white dark:bg-zinc-100 dark:text-zinc-900 transition"
          : "region-pill shrink-0 px-2.5 py-1 rounded-md text-zinc-500 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-zinc-900 transition";
      });
      renderParkDirectory();
      renderGlobalMarkers();
    }

    function clearSearch() {
      document.getElementById("park-search").value = "";
      renderParkDirectory();
    }

    function updateGlobalStats() {
      const parks = PARKS_DATA.filter(p => currentCategoryFilter === "all" || p.category === "core");
      let totalRides = 0;
      let completedRides = 0;
      parks.forEach(p => {
        const rides = getAllRidesForPark(p);
        totalRides += rides.length;
        rides.forEach(r => { if (riddenRides[r.id]) completedRides++; });
      });
      document.getElementById("stat-rides").textContent = `${completedRides} / ${totalRides}`;
    }

    function renderGlobalMarkers() {
      parkMarkersGroup.clearLayers();
      if (activeParkId) return;

      getVisibleParks().forEach(park => {
        const rides = getAllRidesForPark(park);
        const riddenCount = rides.filter(r => riddenRides[r.id]).length;

        const markerHtml = `
          <div class="inline-flex items-center gap-1.5 px-2 py-1 rounded-md bg-zinc-900/95 dark:bg-zinc-100/95 text-white dark:text-zinc-950 border border-white/20 dark:border-zinc-900/20 shadow-md text-[11px] font-medium whitespace-nowrap hover:scale-105 transition-transform">
            <span class="w-1.5 h-1.5 rounded-full ${riddenCount > 0 ? 'bg-emerald-400 dark:bg-emerald-600' : 'bg-accent-500'}"></span>
            <span>${park.name}</span>
            <span class="font-mono text-[10px] opacity-70 tabular-nums">${riddenCount}/${rides.length}</span>
          </div>
        `;
        const icon = L.divIcon({ html: markerHtml, className: "", iconAnchor: [50, 14] });
        const marker = L.marker(park.coords, { icon }).addTo(parkMarkersGroup);
        marker.on("click", () => selectPark(park.id));
      });
    }

    function renderParkDirectory() {
      const query = document.getElementById("park-search").value.trim().toLowerCase();
      document.getElementById("clear-search-btn").classList.toggle("hidden", !query);

      const container = document.getElementById("park-list");
      container.innerHTML = "";

      const filtered = getVisibleParks().filter(p => {
        const rides = getAllRidesForPark(p);
        return p.name.toLowerCase().includes(query) ||
               p.city.toLowerCase().includes(query) ||
               rides.some(r => r.name.toLowerCase().includes(query));
      });

      filtered.forEach(park => {
        const rides = getAllRidesForPark(park);
        const riddenCount = rides.filter(r => riddenRides[r.id]).length;
        const pct = rides.length ? Math.round((riddenCount / rides.length) * 100) : 0;

        const row = document.createElement("div");
        row.className = "group relative px-4 py-3.5 hover:bg-zinc-50 dark:hover:bg-zinc-900/60 cursor-pointer transition-colors";
        row.onclick = () => selectPark(park.id);

        row.innerHTML = `
          <div class="flex items-center justify-between gap-3">
            <div class="min-w-0">
              <h3 class="text-xs font-semibold text-zinc-900 dark:text-zinc-100 truncate group-hover:text-accent-600 dark:group-hover:text-accent-400 transition-colors">
                ${park.name}
              </h3>
              <p class="text-[11px] text-zinc-500 dark:text-zinc-400 truncate mt-0.5">${park.city}</p>
            </div>
            <div class="shrink-0 flex items-center gap-2">
              <span class="font-mono text-xs tabular-nums ${riddenCount === rides.length ? 'text-emerald-600 dark:text-emerald-400 font-semibold' : 'text-zinc-500 dark:text-zinc-400'}">
                ${riddenCount}/${rides.length}
              </span>
              <i class="ph ph-caret-right text-xs text-zinc-400 group-hover:translate-x-0.5 transition-transform"></i>
            </div>
          </div>
          <div class="mt-2.5 w-full h-[2px] bg-zinc-100 dark:bg-zinc-900 overflow-hidden">
            <div class="h-full bg-accent-600 transition-all duration-300" style="width: ${pct}%"></div>
          </div>
        `;
        container.appendChild(row);
      });
    }

    function selectPark(parkId) {
      activeParkId = parkId;
      const park = PARKS_DATA.find(p => p.id === parkId);
      if (!park) return;

      document.getElementById("view-directory").classList.add("hidden");
      document.getElementById("view-park-detail").classList.remove("hidden");
      document.getElementById("world-reset-btn").classList.remove("hidden");
      document.getElementById("world-reset-btn").classList.add("inline-flex");
      document.getElementById("header-context").textContent = park.name;

      parkMarkersGroup.clearLayers();
      switchBasemap("park");
      map.flyTo(park.coords, park.zoom, { duration: 1.1 });

      document.getElementById("detail-title").textContent = park.name;
      document.getElementById("detail-location").textContent = park.city;
      document.getElementById("detail-official-map-link").href = park.officialMapUrl;

      renderParkDetailRides(park);
      renderParkRideMarkers(park);
    }

    function setRideStatusFilter(status) {
      currentRideStatusFilter = status;
      ["all", "ridden", "unridden"].forEach(s => {
        const btn = document.getElementById(`rf-${s}`);
        btn.className = s === status
          ? "px-2 py-0.5 rounded bg-zinc-900 text-white dark:bg-zinc-100 dark:text-zinc-900 transition"
          : "px-2 py-0.5 rounded text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-200 transition";
      });
      if (activeParkId) {
        renderParkDetailRides(PARKS_DATA.find(p => p.id === activeParkId));
      }
    }

    function renderParkDetailRides(park) {
      const allRides = getAllRidesForPark(park);
      const riddenCount = allRides.filter(r => riddenRides[r.id]).length;
      const pct = allRides.length ? Math.round((riddenCount / allRides.length) * 100) : 0;

      document.getElementById("detail-progress-text").textContent = `${riddenCount} / ${allRides.length} ridden (${pct}%)`;
      document.getElementById("detail-progress-bar").style.width = `${pct}%`;

      const filtered = allRides.filter(r => {
        if (currentRideStatusFilter === "ridden") return !!riddenRides[r.id];
        if (currentRideStatusFilter === "unridden") return !riddenRides[r.id];
        return true;
      });

      const grouped = {};
      filtered.forEach(r => {
        if (!grouped[r.land]) grouped[r.land] = [];
        grouped[r.land].push(r);
      });

      const container = document.getElementById("detail-rides-container");
      container.innerHTML = "";

      Object.entries(grouped).forEach(([land, landRides]) => {
        const landDone = landRides.filter(r => riddenRides[r.id]).length;
        const section = document.createElement("div");
        section.innerHTML = `
          <div class="flex items-center justify-between mb-2">
            <span class="font-mono text-[10px] font-semibold uppercase tracking-wider text-zinc-400 dark:text-zinc-500">${land}</span>
            <span class="font-mono text-[10px] text-zinc-400 tabular-nums">${landDone}/${landRides.length}</span>
          </div>
        `;

        const list = document.createElement("div");
        list.className = "space-y-1";

        landRides.forEach(ride => {
          const isChecked = !!riddenRides[ride.id];
          const item = document.createElement("div");
          item.className = `group flex items-center justify-between px-3 py-2 rounded-lg border cursor-pointer transition-all ${
            isChecked
              ? "bg-zinc-900/5 dark:bg-white/5 border-zinc-300 dark:border-zinc-700"
              : "bg-transparent border-zinc-200/70 dark:border-zinc-800/80 hover:border-zinc-300 dark:hover:border-zinc-700"
          }`;
          item.onclick = () => toggleRide(ride.id);

          item.innerHTML = `
            <div class="flex items-center gap-2.5 min-w-0">
              <div class="w-4 h-4 rounded flex items-center justify-center border transition ${
                isChecked
                  ? "bg-accent-600 border-accent-600 text-white"
                  : "border-zinc-300 dark:border-zinc-700 text-transparent"
              }">
                <i class="ph-bold ph-check text-[10px]"></i>
              </div>
              <div class="min-w-0">
                <div class="text-xs font-medium text-zinc-900 dark:text-zinc-100 truncate">${ride.name}</div>
                <div class="text-[11px] text-zinc-400 dark:text-zinc-500 truncate">${ride.type}</div>
              </div>
            </div>
            <button onclick="event.stopPropagation(); focusRidePin('${ride.id}')" title="Locate on Map"
              class="shrink-0 ml-2 w-6 h-6 rounded hover:bg-zinc-200/60 dark:hover:bg-zinc-800 flex items-center justify-center text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 transition">
              <i class="ph ph-crosshair text-xs"></i>
            </button>
          `;
          list.appendChild(item);
        });

        section.appendChild(list);
        container.appendChild(section);
      });
    }

    function renderParkRideMarkers(park) {
      rideMarkersGroup.clearLayers();
      const rides = getAllRidesForPark(park);

      rides.forEach(ride => {
        const isChecked = !!riddenRides[ride.id];
        const lat = park.coords[0] + (ride.offset ? ride.offset[0] : 0);
        const lng = park.coords[1] + (ride.offset ? ride.offset[1] : 0);

        const pinHtml = `
          <div class="inline-flex items-center gap-1.5 px-2 py-1 rounded-md border text-[11px] font-medium whitespace-nowrap shadow-md transition-transform hover:scale-105 ${
            isChecked
              ? "bg-accent-600 border-white/30 text-white"
              : "bg-zinc-950/90 border-zinc-700 text-zinc-100"
          }">
            <i class="ph-bold ${isChecked ? 'ph-check' : 'ph-ticket'} text-[10px]"></i>
            <span>${ride.name}</span>
          </div>
        `;
        const icon = L.divIcon({ html: pinHtml, className: "", iconAnchor: [40, 12] });
        const marker = L.marker([lat, lng], { icon }).addTo(rideMarkersGroup);
        marker.rideId = ride.id;

        marker.bindPopup(`
          <div class="min-w-[180px]">
            <div class="font-mono text-[10px] uppercase tracking-wider text-zinc-400">${ride.land}</div>
            <div class="text-xs font-semibold text-white mt-0.5">${ride.name}</div>
            <div class="text-[11px] text-zinc-400 mb-2.5">${ride.type}</div>
            <button onclick="toggleRide('${ride.id}')" class="w-full py-1.5 px-2.5 rounded-md text-xs font-medium flex items-center justify-center gap-1.5 transition ${
              isChecked ? "bg-zinc-800 hover:bg-zinc-700 text-zinc-200" : "bg-accent-600 hover:bg-accent-500 text-white"
            }">
              <i class="ph-bold ${isChecked ? 'ph-x' : 'ph-check'} text-xs"></i>
              <span>${isChecked ? "Unmark Ride" : "Mark as Ridden"}</span>
            </button>
          </div>
        `);
      });
    }

    function focusRidePin(rideId) {
      if (!activeParkId) return;
      const park = PARKS_DATA.find(p => p.id === activeParkId);
      const ride = getAllRidesForPark(park).find(r => r.id === rideId);
      if (!ride) return;

      if (window.innerWidth < 1024) switchMobileTab("map");

      const lat = park.coords[0] + (ride.offset ? ride.offset[0] : 0);
      const lng = park.coords[1] + (ride.offset ? ride.offset[1] : 0);
      map.flyTo([lat, lng], 18, { duration: 0.6 });

      rideMarkersGroup.eachLayer(layer => {
        if (layer.rideId === rideId) layer.openPopup();
      });
    }

    function toggleRide(rideId) {
      riddenRides[rideId] = !riddenRides[rideId];
      localStorage.setItem("ctc_ridden_rides", JSON.stringify(riddenRides));
      updateGlobalStats();
      if (activeParkId) {
        const park = PARKS_DATA.find(p => p.id === activeParkId);
        renderParkDetailRides(park);
        renderParkRideMarkers(park);
      } else {
        renderGlobalMarkers();
      }
    }

    function toggleAllParkRides() {
      if (!activeParkId) return;
      const park = PARKS_DATA.find(p => p.id === activeParkId);
      const rides = getAllRidesForPark(park);
      const allDone = rides.every(r => riddenRides[r.id]);
      rides.forEach(r => { riddenRides[r.id] = !allDone; });
      localStorage.setItem("ctc_ridden_rides", JSON.stringify(riddenRides));
      updateGlobalStats();
      renderParkDetailRides(park);
      renderParkRideMarkers(park);
    }

    function toggleAddRideDrawer() {
      document.getElementById("custom-ride-drawer").classList.toggle("hidden");
    }

    function addCustomRide() {
      if (!activeParkId) return;
      const nameInput = document.getElementById("new-ride-name");
      const landInput = document.getElementById("new-ride-land");
      const name = nameInput.value.trim();
      const land = landInput.value.trim() || "Additional";
      if (!name) return;

      if (!customRides[activeParkId]) customRides[activeParkId] = [];
      const newId = `custom-${Date.now()}`;
      customRides[activeParkId].push({
        id: newId,
        name,
        land,
        type: "Custom Entry",
        offset: [(Math.random() - 0.5) * 0.002, (Math.random() - 0.5) * 0.002]
      });
      riddenRides[newId] = true;

      localStorage.setItem("ctc_custom_rides", JSON.stringify(customRides));
      localStorage.setItem("ctc_ridden_rides", JSON.stringify(riddenRides));

      nameInput.value = "";
      landInput.value = "";
      document.getElementById("custom-ride-drawer").classList.add("hidden");

      const park = PARKS_DATA.find(p => p.id === activeParkId);
      renderParkDetailRides(park);
      renderParkRideMarkers(park);
      updateGlobalStats();
    }

    function resetWorldView() {
      activeParkId = null;
      rideMarkersGroup.clearLayers();
      document.getElementById("view-park-detail").classList.add("hidden");
      document.getElementById("view-directory").classList.remove("hidden");
      document.getElementById("world-reset-btn").classList.add("hidden");
      document.getElementById("world-reset-btn").classList.remove("inline-flex");
      document.getElementById("header-context").textContent = "World Index";
      switchBasemap("canvas");
      map.flyTo([25, 45], 3, { duration: 1.0 });
      renderParkDirectory();
      renderGlobalMarkers();
    }

    function switchMobileTab(tab) {
      const drawer = document.getElementById("left-drawer");
      const mapWorkspace = document.getElementById("map-workspace");
      const tabList = document.getElementById("mob-tab-list");
      const tabMap = document.getElementById("mob-tab-map");

      const activeClass = "flex items-center justify-center gap-2 py-1.5 rounded-lg text-xs font-medium bg-zinc-100 dark:bg-zinc-900 text-zinc-900 dark:text-zinc-100";
      const inactiveClass = "flex items-center justify-center gap-2 py-1.5 rounded-lg text-xs font-medium text-zinc-500 dark:text-zinc-400";

      tabList.className = tab === "list" ? activeClass : inactiveClass;
      tabMap.className = tab === "map" ? activeClass : inactiveClass;

      if (tab === "list") {
        drawer.classList.remove("hidden");
        mapWorkspace.classList.add("hidden");
      } else {
        drawer.classList.add("hidden");
        mapWorkspace.classList.remove("hidden");
        setTimeout(() => map.invalidateSize(), 50);
      }
    }

    window.addEventListener("resize", () => {
      if (window.innerWidth >= 1024) {
        document.getElementById("left-drawer").classList.remove("hidden");
        document.getElementById("map-workspace").classList.remove("hidden");
      }
      map.invalidateSize();
    });

    // Boot
    renderParkDirectory();
    renderGlobalMarkers();
    updateGlobalStats();
  </script>
</body>
</html>
